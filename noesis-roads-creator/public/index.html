<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>noesis-roads-creator · crea le schede didattiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#17344a;--muted:#6b7a83;--paper:#f6f3ee;--white:#fffdf9;--line:#dedbd3;--coral:#dc7056;--mustard:#e2ac44;--green:#628f80;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;background:var(--paper)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;letter-spacing:-.04em}
.app{max-width:1200px;margin:0 auto;padding:0 28px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.topbar .left{display:flex;align-items:center;gap:16px}
.topbar .hub-btn{border-color:var(--ink);color:var(--ink)}
.topbar .hub-btn:hover{border-color:var(--coral);color:var(--coral)}
.topbar-title{margin:0 0 18px;font-size:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:19px;font-weight:700}
.brand-mark{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.brand-mark i{display:block;width:6px;height:16px;border-radius:5px;transform:rotate(35deg);background:var(--coral)}
.brand-mark i:nth-child(2){height:20px;background:var(--mustard)}
.brand-mark i:nth-child(3){height:13px;background:var(--ink)}
.topbar .right{display:flex;align-items:center;gap:14px}
.eyebrow{color:var(--coral);text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.16em}
.page-title{font-size:38px;margin:8px 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.6;max-width:640px}
.btn{border:0;border-radius:6px;padding:12px 18px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:11px;border-radius:5px}
.card{background:var(--white);border:1px solid #e5e2dc;border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(30,42,44,.04)}
.banner{background:#fdf1e8;border:1px solid #f0d5c3;border-radius:12px;padding:14px 18px;color:#8a5a3a;font-size:12px;margin-bottom:22px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:#eef6f1;border-color:#cfe5da;color:#47715f}
.grid-artworks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.aw-card{border:0;background:var(--white);border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;text-align:left;padding:0;box-shadow:0 6px 18px rgba(30,42,44,.04)}
.aw-card .thumb{height:170px;background:#eee9e1;overflow:hidden;position:relative}
.aw-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--white);border-radius:20px;padding:5px 9px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.badge.ready{color:#47715f}
.aw-card .body{padding:14px 16px}
.aw-card .body h3{margin:0 0 4px;font-size:19px}
.aw-card .body p{margin:0;color:var(--muted);font-size:11px}
.aw-card .actions{display:flex;gap:8px;padding:0 16px 14px}
.aw-card .actions .btn{flex:1;justify-content:center}
/* ---------- workspace ---------- */
.ws-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:22px;align-items:start}
.dropzone{border:2px dashed var(--line);border-radius:14px;background:var(--white);padding:38px 24px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
.dropzone:hover,.dropzone.over{border-color:var(--coral);background:#fff9f5}
.dropzone .dz-icon{font-size:34px;margin-bottom:8px}
.dropzone p{margin:4px 0;font-size:12px}
.image-stage{position:relative;border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;background:#eee9e1}
.image-stage img{width:100%;display:block}
.image-stage .region-overlay{position:absolute;border:2px solid var(--coral);background:rgba(220,112,86,.08);border-radius:2px;pointer-events:none}
.image-stage .region-overlay span{position:absolute;top:-20px;left:0;background:var(--coral);color:#fff;font-size:9px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.detail-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.detail-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--white);cursor:pointer;transition:.15s}
.detail-item:hover{border-color:var(--coral)}
.detail-item.active{border-color:var(--coral);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.detail-item .n{color:var(--coral);font-weight:700;font-size:11px;margin-top:1px}
.detail-item .d strong,.detail-item .d small{display:block}
.detail-item .d strong{font-size:12px}
.detail-item .d small{color:var(--muted);font-size:10px;margin-top:3px}
.detail-item .st{margin-left:auto;font-size:9px;color:var(--green);white-space:nowrap;font-weight:700;text-transform:uppercase}
/* ---------- forms ---------- */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--white);padding:9px 11px;font-size:12px;color:var(--ink)}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
/* ---------- contenuti ---------- */
.content-tabs{display:flex;gap:8px;margin:14px 0 12px}
.ctab{flex:1;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:10px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.ctab.active{border-color:var(--coral);color:var(--ink);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.section-block{border-top:1px solid var(--line);padding:11px 0}
.section-block h4{font-family:'DM Sans';font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);margin:0 0 6px}
.section-block textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.55;min-height:66px;resize:vertical;background:var(--white)}
.section-block.look textarea{min-height:40px;background:var(--paper)}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.step-note{color:var(--muted);font-size:11px;margin:6px 0 0}
.progress{height:6px;background:#eeeae3;border-radius:4px;overflow:hidden;margin:14px 0 8px}
.progress i{display:block;height:100%;background:var(--coral);border-radius:4px;transition:width .4s}
.log-line{font-size:11px;color:var(--muted);padding:2px 0;display:flex;gap:8px;align-items:center}
.log-line.done{color:#47715f}
.log-line .dot{width:6px;height:6px;border-radius:50%;background:var(--mustard);flex-shrink:0}
.log-line.done .dot{background:var(--green)}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.pipe-card{border-left:4px solid var(--coral);margin-bottom:18px}
.pipe-card.ok{border-left-color:var(--green);background:#fbfdf9}
.pipe-card.err{border-left-color:#b03a2e}
.pipe-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pipe-pct{font-size:30px;font-weight:800;font-family:'Playfair Display',Georgia,serif;color:var(--coral);line-height:1}
.pipe-card.ok .pipe-pct{color:var(--green)}
.pipe-activity{font-size:12px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600;line-height:1.5}
.pipe-err{font-size:12px;color:#a33a2a;background:#fbeae7;border-radius:8px;padding:9px 12px;line-height:1.5}
.pipe-done-note{font-size:12px;color:var(--green);margin:8px 0 0;line-height:1.6}
.pipe-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pipe-phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.pipe-chip{font-size:10px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:20px;opacity:.75}
.pipe-chip.act{color:var(--coral);border-color:var(--coral);opacity:1;background:#fff9f5}
.pipe-chip.done{color:#47715f;border-color:#cfe5da;background:#eef6f1;opacity:1}
.img-panel{display:grid;grid-template-columns:minmax(0,4fr) minmax(160px,1fr);gap:14px;align-items:start}
.spot-wrap{position:relative;border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;background:#eee9e1;line-height:0}
.spot-wrap canvas{width:100%;height:auto;display:block}
.cap-rail{background:var(--white);border:1px solid #e5e2dc;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;max-height:540px;overflow:auto}
.rail-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--coral);margin:0 2px 2px}
.cap{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--ink);transition:.15s}
.cap:hover{border-color:var(--coral);background:#fff9f5}
.cap .num{color:var(--coral);font-weight:700;font-size:12px;min-width:16px;padding-top:1px}
.cap .cap-t{font-size:11.5px;line-height:1.35;font-weight:600}
.cap .cap-c{display:block;font-size:9px;color:var(--muted);font-weight:500;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.cap.on{border-color:var(--coral);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.spot-hint{font-size:10px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.spot-edit{position:absolute;inset:0;pointer-events:none;z-index:3}
.spot-edit .bx{position:absolute;border:2px dashed rgba(220,112,86,.9);pointer-events:auto;cursor:move;touch-action:none}
.spot-edit .bx.on{border:2px solid var(--coral);background:rgba(220,112,86,.10)}
.spot-edit .bx-lab{position:absolute;top:4px;left:4px;background:var(--coral);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;line-height:1.4;pointer-events:none;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
.spot-edit .bx.on .bx-lab{background:var(--ink)}
.spot-edit .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--coral);border-radius:3px;pointer-events:auto;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.spot-edit .h.nw{left:-7px;top:-7px;cursor:nwse-resize}
.spot-edit .h.n{left:50%;top:-7px;margin-left:-6px;cursor:ns-resize}
.spot-edit .h.ne{right:-7px;top:-7px;cursor:nesw-resize}
.spot-edit .h.e{right:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.spot-edit .h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.spot-edit .h.s{left:50%;bottom:-7px;margin-left:-6px;cursor:ns-resize}
.spot-edit .h.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.spot-edit .h.w{left:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.nd-overlay{z-index:6}
.nd-capture{position:absolute;inset:0;z-index:7;cursor:crosshair;pointer-events:auto;touch-action:none}
.nd-tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:8;background:rgba(23,52,74,.88);color:#fff;font-size:11px;font-weight:600;padding:7px 14px;border-radius:20px;pointer-events:none;white-space:nowrap}
.nd-draw{border:2px dashed var(--coral);background:rgba(220,112,86,.10)}
.bx.nd-new{border-style:solid;background:rgba(220,112,86,.10)}
.nd-panel{background:var(--white);border:1px solid #f0c9bc;border-left:4px solid var(--coral);border-radius:12px;padding:14px 16px;margin:12px 0 2px;box-shadow:0 6px 18px rgba(30,42,44,.06)}
.nd-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nd-p{font-size:12px;color:var(--ink);line-height:1.5;display:inline-flex;gap:8px;align-items:center}
.nd-field-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.nd-field-row .field{margin:0}
.nd-chip{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;margin-top:10px;display:inline-block}
.nd-chip.ok{background:#eef6f1;color:#47715f;border:1px solid #cfe5da}
.nd-chip.warn{background:#fdf6e8;color:#8a6a2f;border:1px solid #ecd9b0}
.nd-banner{border-radius:10px;padding:12px 14px;margin:2px 0 12px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.55;border:1px solid}
.nd-banner .nd-ico{font-size:16px;line-height:1.3}
.nd-banner strong{font-size:12px;display:block}
.nd-banner p{margin:3px 0 0;font-size:11.5px}
.nd-banner.complete{background:#eef6f1;border-color:#cfe5da;color:#35624e}
.nd-banner.partial{background:#fdf6e8;border-color:#ecd9b0;color:#7a5d22}
.nd-banner.insufficient{background:#fbeae7;border-color:#ecc9c2;color:#8f3123}
.nd-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media(max-width:760px){.img-panel{grid-template-columns:1fr}.cap-rail{max-height:200px}}
/* feedback salvataggio */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d5a43;color:#fff;padding:15px 24px;border-radius:30px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.25);transition:.35s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- viewer ---------- */
.viewer-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:22px;align-items:start}
.viewer-title h1{font-size:42px;margin:6px 0 6px}
.viewer-title .meta{color:var(--muted);font-size:12px;margin:0}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ov-col h4{font-family:'DM Sans';font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--coral);margin:0 0 8px}
.ov-col p{font-size:12px;line-height:1.7;margin:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:22px;margin:0}
.confidence{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;padding:6px 10px;border-radius:20px;background:#e6eef0;color:#47717c}
.hotspot-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hchip{border:1px solid var(--line);background:var(--white);border-radius:30px;padding:8px 13px;font-size:11px;color:var(--ink)}
.hchip.active{border-color:var(--coral);background:#fff9f5;color:var(--coral);font-weight:700}
.sources a{display:block;color:var(--ink);text-decoration:none;font-size:11px;padding:3px 0}
.sources span{color:var(--muted);font-size:9px}
.muted-note{color:var(--muted);font-size:9px;line-height:1.5;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state h2{color:var(--ink);font-size:26px}
@media(max-width:900px){.ws-layout,.viewer-layout{grid-template-columns:1fr}.meta-grid,.ov-grid{grid-template-columns:1fr}.app{padding:0 14px 60px}}
/* ---- Passo 4 · Opere simili ---- */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sim-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.sim-thumb{width:100%;height:150px;object-fit:cover;display:block;background:#eeeae3}
.sim-ph{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#eeeae3;color:var(--muted);font-size:11px;text-align:center;padding:10px;box-sizing:border-box}
.sim-fields{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sim-fields label{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.sim-fields input,.sim-fields textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12px;font-family:inherit;background:var(--white);color:var(--ink);box-sizing:border-box}
.sim-fields textarea{min-height:52px;resize:vertical}
.sim-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sim-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
.sim-status{margin-left:auto;color:var(--muted);font-size:9px}
/* carousel viewer */
.sim-carousel{display:flex;align-items:center;gap:8px;padding:6px 0}
.car-arrow{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.car-arrow:hover{border-color:var(--coral);color:var(--coral)}
.sim-track{flex:1;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.sim-track-inner{display:flex;gap:14px;min-width:max-content}
.sim-slide{flex:0 0 230px;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white);scroll-snap-align:start}
.sim-slide a{display:block}
.sim-thumb-lg{width:100%;height:150px;object-fit:cover;display:block;background:#eeeae3}
.sim-ph-lg{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#eeeae3;color:var(--muted);font-size:11px;text-align:center;padding:10px;box-sizing:border-box}
.sim-slide figcaption{padding:10px 12px}
.sim-slide figcaption strong{display:block;font-size:13px;line-height:1.3;color:var(--ink)}
.sim-slide figcaption span,.sim-slide figcaption small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.sim-slide figcaption p{margin:7px 0 0;color:var(--ink);font-size:11px;line-height:1.5}
/* ---- Schede Soggetto e Faccia a faccia ---- */
/* Filtri a tab della home (come il catalogo del viewer) */
.home-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px}
.home-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:30px;padding:9px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s}
.home-tab:hover{border-color:var(--coral);background:#fff9f5}
.home-tab.active{border-color:var(--coral);background:var(--coral);color:#fff}
.home-tab .tab-count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--paper);color:var(--muted);font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.home-tab.active .tab-count{background:rgba(255,255,255,.25);color:#fff}
.type-tag.tag-btn{cursor:pointer;font:inherit;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.type-tag.tag-btn:hover{background:#fff9f5}
.type-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 14px}
.type-head h2{margin:0;font-size:26px}
.type-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--coral);border:1px solid #e8c5ba;border-radius:20px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.subj-card{background:linear-gradient(150deg,var(--white),#f4ece1);border:1px solid #e5e2dc;border-radius:12px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-height:170px;position:relative;overflow:hidden}
.subj-card .s-ico{width:44px;height:44px;border-radius:12px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;font-family:'Playfair Display',serif}
.subj-card h3{margin:0;font-size:21px}
.subj-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
.subj-card .actions{margin-top:auto;display:flex;gap:8px}

</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= stato ================= */
var state = { view: 'home', homeTab: 'all', artwork: null, list: [], cards: [], busy: {}, log: [] };

/* ================= api ================= */
function api(path, opts) {
  return fetch(path, opts || {}).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      if (!res.ok) { var e = new Error((body.error && body.error.message) || ('HTTP ' + res.status)); e.status = res.status; e.body = body; throw e; }
      return body;
    });
  });
}
function post(path, body) { return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function put(path, body) { return api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function patch(path, body) { return api(path, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function del(path) { return api(path, { method: 'DELETE' }); }

/* esporta la scheda corrente come PDF "libro d'arte" */
function downloadPdf(path, fallbackName) {
  var btn = document.querySelector('[data-pdf]');
  var old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  toast('Generazione del PDF in corso…');
  fetch(path).then(function (res) {
    if (!res.ok) return res.json().catch(function () { return {}; }).then(function (b) { throw new Error((b.error && b.error.message) || ('HTTP ' + res.status)); });
    var cd = res.headers.get('content-disposition') || '';
    var m = cd.match(/filename="?([^";]+)"?/);
    return res.blob().then(function (blob) { return { blob: blob, name: m ? m[1] : (fallbackName || 'scheda.pdf') }; });
  }).then(function (r) {
    var url = URL.createObjectURL(r.blob);
    var a = document.createElement('a');
    a.href = url; a.download = r.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('PDF generato: ' + r.name, true);
  }).catch(function (e) {
    toast('PDF non generato: ' + e.message);
  }).then(function () {
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  });
}

/* ================= util ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.innerHTML = (ok ? '✓ ' : '⚠ ') + esc(msg);
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 4000);
}
function sectionOf(tab) { return tab === 'studio' ? ['observation', 'meaning', 'relation'] : ['curiosity', 'comparisons', 'openQuestions', 'technique']; }
function fieldLabel(key) {
  return { observation: 'Cosa vedi', meaning: 'Cosa significa', relation: 'In relazione all’opera', curiosity: 'Una curiosità', comparisons: 'Confronti con altre opere', openQuestions: 'Questioni aperte', technique: 'Tecnica e materia', lookAgain: 'Guarda ancora' }[key] || key;
}
function cropDataUrl(imgEl, region, maxSide) {
  return new Promise(function (resolve) {
    if (!imgEl || !imgEl.naturalWidth || !region) return resolve(null);
    var pad = 0.02;
    var x = Math.max(0, region.x - pad), y = Math.max(0, region.y - pad);
    var right = Math.min(1, region.x + region.width + pad), bottom = Math.min(1, region.y + region.height + pad);
    var sw = Math.max(1, (right - x) * imgEl.naturalWidth);
    var sh = Math.max(1, (bottom - y) * imgEl.naturalHeight);
    var scale = Math.min(1, (maxSide || 900) / Math.max(sw, sh));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(sw * scale));
    c.height = Math.max(1, Math.round(sh * scale));
    c.getContext('2d').drawImage(imgEl, x * imgEl.naturalWidth, y * imgEl.naturalHeight, sw, sh, 0, 0, c.width, c.height);
    resolve(c.toDataURL('image/jpeg', 0.85));
  });
}
function fileToDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
var imgCache = {};
function loadImage(src) {
  return new Promise(function (resolve) {
    if (imgCache[src]) return resolve(imgCache[src]);
    var img = new Image();
    img.onload = function () { imgCache[src] = img; resolve(img); };
    img.onerror = function () { resolve(null); };
    img.src = src;
  });
}

/* ================= render ================= */
var appEl = document.getElementById('app');

function iconBtn(label, fn, extra) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn small' + (extra || '');
  b.textContent = label;
  b.onclick = fn;
  return b;
}

function render() {
  if (state.view === 'home') {
    // Cambio tab dalla home: ridisegno leggero del solo corpo (le liste sono già in stato).
    if (state.homeRedraw && state.homeSectionEl && document.contains(state.homeSectionEl)) {
      state.homeSectionEl.innerHTML = homeSectionBody();
      // Sincronizza anche lo stato attivo delle tab (il ridisegno leggero non tocca la barra).
      appEl.querySelectorAll('.home-tab').forEach(function (b) {
        var on = b.getAttribute('data-tab') === state.homeTab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      return;
    }
    return renderHome();
  }
  if (state.view === 'studio') return renderStudio();
  if (state.view === 'viewer') return renderViewer();
  if (state.view === 'subject-studio') return renderSubjectStudio();
  if (state.view === 'comparison-studio') return renderComparisonStudio();
  if (state.view === 'card-studio') return renderCardStudio();
  if (state.view === 'subject-viewer') return renderSubjectViewer();
  if (state.view === 'comparison-viewer') return renderComparisonViewer();
}
function topbar(title, rightHtml) {
  // «← Hub» a SINISTRA accanto al brand: navigazione primaria, separata dalle
  // azioni contestuali di pagina a destra («← Elenco», «⬇ PDF»), che restano le
  // uniche voci sulla destra. Il titolo di pagina (title) torna sotto la barra
  // come h1 visibile (page-title), più immediato dell'occhiello nell'header.
  var hub = (window.CREATOR_DATA && window.CREATOR_DATA.hubUrl) || ('http://' + (location.hostname || '127.0.0.1') + ':18080/');
  var right = rightHtml || '';
  var h1 = title ? '<h1 class="page-title topbar-title">' + esc(title) + '</h1>' : '';
  return '<header class="topbar"><div class="left"><a class="brand" href="#" data-nav="home"><span class="brand-mark"><i></i><i></i><i></i></span>noesis-roads-creator</a>' +
    '<button class="btn small ghost hub-btn" onclick="location.href=' + JSON.stringify(hub).replace(/"/g, '&quot;') + '">← Hub</button></div>' +
    '<div class="right">' + right + '</div></header>' + h1;
}

/* ---------- home ---------- */
function homeTypeHeader(title, count, tabKey) {
  // Il contatore è un bottone: porta in primo piano la sezione (filtro a tab «come nel catalogo del viewer»).
  return '<div class="type-head"><h2>' + esc(title) + '</h2>' +
    '<button class="type-tag tag-btn" data-tab="' + tabKey + '" title="Mostra solo questa sezione">' + count + ' ' + (count === 1 ? 'scheda' : 'schede') + '</button></div>';
}
function homeSectionBody() {
  // Corpo della sezione attiva (tab). Il markup è lo stesso delle tre sezioni stacked.
  var html = '';
  if (state.homeTab === 'artwork' || state.homeTab === 'all') {
    html += homeTypeHeader('L’opera', state.list.length, 'artwork');
    if (state.list.length === 0) {
      html += '<p class="step-note" style="margin-bottom:8px">Nessun dipinto: carica l’immagine di un’opera per crearne la scheda didattica.</p>';
    } else {
      html += '<div class="grid-artworks">';
      state.list.forEach(function (a) {
        html += '<div class="aw-card"><div class="thumb"><span class="badge ' + (a.status === 'ready' ? 'ready' : '') + '">' + (a.status === 'ready' ? 'pronta' : 'in lavorazione') + '</span>' +
          (a.imageUrl ? '<img src="' + esc(a.imageUrl) + '" alt="" />' : '') + '</div>' +
          '<div class="body"><h3>' + esc(a.title || 'Senza titolo') + '</h3><p>' + esc(a.artist || '') + (a.date ? ' · ' + esc(a.date) : '') + '</p></div>' +
          '<div class="actions"><button class="btn small" data-open="' + esc(a.id) + '">Modifica</button>' +
          (a.status === 'ready' ? '<button class="btn small primary" data-view="' + esc(a.id) + '">Vedi</button>' : '') +
          '<button class="btn small ghost" data-del="' + esc(a.id) + '">Elimina</button></div></div>';
      });
      html += '</div>';
    }
  }
  if (state.homeTab === 'subject' || state.homeTab === 'all') {
    html += homeTypeHeader('Il soggetto', state.subjects.length, 'subject');
    if (!state.subjects.length) {
      html += '<p class="step-note" style="margin-bottom:8px">Nessun soggetto: crea una scheda che racconta come uno stesso soggetto è stato dipinto nei secoli.</p>';
    } else {
      html += '<div class="grid-artworks">';
      state.subjects.forEach(function (s) {
        html += '<div class="subj-card"><span class="s-ico">' + esc((s.name || '?').charAt(0)) + '</span>' +
          '<span class="badge ' + (s.status === 'ready' ? 'ready' : '') + '" style="position:static;align-self:flex-start">' + (s.status === 'ready' ? 'pronta' : 'in lavorazione') + '</span>' +
          '<h3>' + esc(s.name) + '</h3>' +
          '<p>' + esc(s.shortDesc || 'Scheda monografica sul soggetto nella storia dell’arte.') + '</p>' +
          '<div class="actions"><button class="btn small" data-open-subject="' + esc(s.id) + '">Modifica</button>' +
          (s.status === 'ready' ? '<button class="btn small primary" data-view-subject="' + esc(s.id) + '">Vedi</button>' : '') +
          '<button class="btn small ghost" data-del-subject="' + esc(s.id) + '">Elimina</button></div></div>';
      });
      html += '</div>';
    }
  }
  if (state.homeTab === 'cards' || state.homeTab === 'all') {
    html += homeTypeHeader('Le schede', state.cards.length, 'cards');
    if (!state.cards.length) {
      html += '<p class="step-note" style="margin-bottom:8px">Nessuna scheda generica: scegli materia e modello per creare schede di qualunque materia.</p>';
    } else {
      html += '<div class="grid-artworks">';
      state.cards.forEach(function (c) {
        var sub = String(c.modelloId || '').replace(/:v\d+$/, '').split(':').join(' · ');
        html += '<div class="subj-card"><span class="s-ico">' + esc((c.titolo || '?').charAt(0)) + '</span>' +
          '<span class="badge ' + (c.stato === 'ready' ? 'ready' : '') + '" style="position:static;align-self:flex-start">' + (c.stato === 'ready' ? 'pronta' : 'in lavorazione') + '</span>' +
          '<h3>' + esc(c.titolo || 'Senza titolo') + '</h3>' +
          '<p>' + esc(sub || 'Scheda generica') + '</p>' +
          '<div class="actions"><button class="btn small" data-open-card="' + esc(c.id) + '">Modifica</button>' +
          '<button class="btn small ghost" data-del-card="' + esc(c.id) + '">Elimina</button></div></div>';
      });
      html += '</div>';
    }
  }
  if (state.homeTab === 'comparison' || state.homeTab === 'all') {
    html += homeTypeHeader('Il confronto', state.comparisons.length, 'comparison');
    if (!state.comparisons.length) {
      html += '<p class="step-note" style="margin-bottom:8px">Nessun confronto: metti a paragone due opere (stesso soggetto o stesso artista).</p>';
    } else {
      html += '<div class="grid-artworks">';
      state.comparisons.forEach(function (c) {
        html += '<div class="aw-card"><div class="thumb">' +
          (c.hasThumb ? '<img class="cmp-thumb" src="/api/comparisons/' + esc(c.id) + '/thumb" alt="" />' : '<div class="sim-ph">🖼 composita non ancora generata</div>') +
          '<span class="badge ' + (c.status === 'ready' ? 'ready' : '') + '">' + (c.status === 'ready' ? 'pronta' : 'in lavorazione') + '</span></div>' +
          '<div class="body"><h3>' + esc(c.title || 'Confronto') + '</h3><p>' + (c.comparisonType === 'same-artist' ? 'stesso artista, fasi diverse' : 'stesso soggetto, artisti diversi') + '</p></div>' +
          '<div class="actions"><button class="btn small" data-open-comparison="' + esc(c.id) + '">Modifica</button>' +
          (c.status === 'ready' ? '<button class="btn small primary" data-view-comparison="' + esc(c.id) + '">Vedi</button>' : '') +
          '<button class="btn small ghost" data-del-comparison="' + esc(c.id) + '">Elimina</button></div></div>';
      });
      html += '</div>';
    }
  }
  return html;
}
function renderHome() {
  var html = topbar('',
    '<button class="btn primary small" data-nav="new">+ Nuova opera</button>' +
    '<button class="btn small" data-nav="new-subject">+ Nuovo soggetto</button>' +
    '<button class="btn small" data-nav="new-comparison">+ Nuovo confronto</button>' +
    '<button class="btn small" data-nav="new-card">+ Nuova scheda</button>');
  html += '<h1 class="page-title">Crea le schede didattiche</h1>';
  html += '<p class="lead">Tre tipi storici (dipinto, soggetto, confronto) più le <strong>schede generiche per materia</strong> (arte, filosofia…): scegli il modello, genera le sezioni con l’AI, rivedi e approva. L’intelligenza artificiale propone i contenuti, tu controlli, correggi e salvi.</p>';
  // Filtri a tab come nel catalogo del viewer: «Tutte» + una voce per tipo, con contatore.
  var tabs = [
    ['all', 'Tutte', state.list.length + state.subjects.length + state.comparisons.length + state.cards.length],
    ['artwork', 'L’opera', state.list.length],
    ['subject', 'Il soggetto', state.subjects.length],
    ['comparison', 'Il confronto', state.comparisons.length],
    ['cards', 'Le schede', state.cards.length]
  ];
  html += '<div class="home-tabs" role="tablist">';
  tabs.forEach(function (t) {
    html += '<button class="home-tab' + (state.homeTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '" role="tab" aria-selected="' + (state.homeTab === t[0]) + '">' +
      esc(t[1]) + '<span class="tab-count">' + t[2] + '</span></button>';
  });
  html += '</div>';
  html += '<div id="homeSection">';
  html += homeSectionBody();
  html += '</div>';
  appEl.innerHTML = html;
  state.homeSectionEl = document.getElementById('homeSection');
}

/* ---------- studio (nuova opera + workspace) ---------- */
function StudioView() {
  this.artworkId = null;
  this.imageUrl = null;
  this.pendingFile = null;
  this.details = [];
  this.activeDetailId = null;
  this.spotId = null;
  this.editBoxes = false;
  this.activeTab = 'studio';
  this.genBusy = false;
  this.meta = { title: '', artist: '', date: '', period: '', technique: '', institution: '', location: '' };
}
var studio = null;

function renderStudio() {
  if (!studio) { studio = new StudioView(); }
  var s = studio;
  var html = topbar('', s.artworkId ? '<button class="btn small" data-nav="home">← Elenco</button>' : '');
  html += '<h1 class="page-title">' + (s.artworkId ? 'Genera la scheda didattica' : 'Nuova opera') + '</h1>';
  html += '<p class="lead">' + (s.artworkId ? 'Rivedi i contenuti proposti dall’AI, correggi se serve e premi “Salva nel database”.' : 'Carica l’immagine del dipinto. Tutto il resto — scheda, dettagli, sezioni — lo propone l’intelligenza artificiale.') + '</p>';
  html += '<div id="pipelineWrap">' + pipelineCardHtml() + '</div>';

  // --- STEP 1: upload ---
  html += '<div class="card" style="margin-bottom:18px"><div class="step-head"><span class="eyebrow">Passo 1 · Immagine</span></div>';
  if (!s.artworkId) {
    html += '<div class="dropzone" id="dz"><div class="dz-icon">🖼</div><p><strong>Clicca o trascina qui l’immagine del dipinto</strong></p><p>JPG, PNG o WebP</p><input type="file" id="file" accept="image/*" hidden /></div>';
  } else {
    html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">' +
      '<button class="btn small" id="btnEditBoxes">✏️ Adatta riquadri</button>' +
      '<span class="spot-hint" id="editBoxHint" style="margin:0">Ridimensiona i riquadri dei dettagli per adattarli alle figure complete.</span></div>';
    html += '<div class="img-panel"><div class="spot-wrap"><canvas id="wsSpot"></canvas></div><div class="cap-rail" id="wsRail"></div></div>';
    html += '<p class="spot-hint" id="spotHintTxt">L’immagine occupa le fasce 1–4; la fascia 5 a destra elenca le didascalie dei dettagli. Premi una didascalia: quel dettaglio resta a colori, il resto dell’immagine diventa in scala di grigi. Ripremi la didascalia attiva per tornare all’immagine completa.</p>';
  }
  html += '</div>';

  if (s.artworkId) {
    // --- STEP 2: metadati ---
    html += '<div class="card" style="margin-bottom:18px"><div class="step-head"><span class="eyebrow">Passo 2 · Scheda dell’opera</span>' +
      '<button class="btn small" id="btnMeta">✨ Riconosci automaticamente</button></div>';
    html += '<div class="meta-grid">';
    [['title', 'Titolo'], ['artist', 'Artista'], ['date', 'Data'], ['period', 'Periodo'], ['technique', 'Tecnica'], ['institution', 'Istituzione'], ['location', 'Collocazione']].forEach(function (f) {

    });

    // --- STEP 3: dettagli + overview ---

}

function bindStudio(s) {
  var dz = document.getElementById('dz');
  if (dz) {
    var input = document.getElementById('file');
    dz.onclick = function () { input.click(); };
    dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = function () { dz.classList.remove('over'); };
    dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
    input.onchange = function () { if (input.files[0]) handleFile(input.files[0]); };
  }
  if (s.artworkId) {
    var metaBtn = document.getElementById('btnMeta');
    if (metaBtn) metaBtn.onclick = function () { runMeta(); };
    var dBtn = document.getElementById('btnDetails');
    if (dBtn) dBtn.onclick = function () { runDetails(); };
    var oBtn = document.getElementById('btnOverview');
    if (oBtn) oBtn.onclick = function () { runOverview(); };
    var simBtn = document.getElementById('btnSimilar');
    if (simBtn) simBtn.onclick = function () { runSimilar(); };
    var editBtn = document.getElementById('btnEditBoxes');
    if (editBtn) editBtn.onclick = function () { toggleBoxEditor(); };
    var addBtn = document.getElementById('btnAddDetail');
    if (addBtn) addBtn.onclick = function () { openNewDetail(); };
    var p4 = appEl.querySelectorAll('[data-p4]');
    p4.forEach(function (el) {
      el.onclick = function () {
        var tab = el.getAttribute('data-p4');
        p4.forEach(function (x) { x.classList.toggle('active', x === el); });
        var ov = document.getElementById('overviewArea');
        var sim = document.getElementById('similarArea');
        if (ov) ov.style.display = tab === 'overview' ? '' : 'none';
        if (sim) sim.style.display = tab === 'similar' ? '' : 'none';
        if (tab === 'similar') renderSimilarPanel();
      };
    });
    var sBtn = document.getElementById('btnSave');
    if (sBtn) sBtn.onclick = function () { runSave(); };
    var metaInputs = appEl.querySelectorAll('[data-meta]');
    metaInputs.forEach(function (inp) {
      inp.onchange = function () { s.meta[inp.getAttribute('data-meta')] = inp.value; };
      inp.oninput = function () { s.meta[inp.getAttribute('data-meta')] = inp.value; };
    });
    refreshMetaFromServer();
    renderDetailsPanel();
    renderOverviewPanel();
  }
}

function handleFile(file) {
  if (!file.type.match(/^image\//)) return toast('Il file deve essere un’immagine');
  toast('Caricamento immagine…');
  fileToDataUrl(file).then(function (dataUrl) {
    var id = 'opera-' + Date.now().toString(36);
    studio.pendingFile = dataUrl;
    return post('/api/artworks', { id: id, imageDataUrl: dataUrl }).then(function (body) {
      studio.artworkId = body.artwork.id;
      studio.imageUrl = body.artwork.imageUrl;
      toast('Immagine caricata: opera creata', true);
      render();
      // pipeline automatica: riconoscimento → dettagli → contenuti → presentazione
      pipeStart();
    }).catch(function (e) { toast(e.message); });
  });
}
function refreshMetaFromServer() {
  api('/api/artworks/' + studio.artworkId).then(function (full) {
    ['title', 'artist', 'date', 'period', 'technique', 'institution', 'location'].forEach(function (k) {
      var val = full[k];
      if (val) studio.meta[k] = val;
    });
    var inputs = appEl.querySelectorAll('[data-meta]');
    inputs.forEach(function (inp) { inp.value = studio.meta[inp.getAttribute('data-meta')] || ''; });
    studio.details = full.details || [];
    studio.activeDetailId = studio.activeDetailId || (studio.details[0] ? studio.details[0].id : null);
    renderDetailsPanel();
    renderOverviewPanel();
    paintStudioPanel();
  }).catch(function () {});
}
function collectMetaFromInputs() {
  var inputs = appEl.querySelectorAll('[data-meta]');

}
function runMeta() {

function renderOverlays() {

function runDetails() {
  var btn = document.getElementById('btnDetails');

  post('/api/artworks/' + studio.artworkId + '/generate/details').then(function (body) {

    return put('/api/artworks/' + studio.artworkId + '/details', { details: items }).then(function (saved) {

function detailReady(detail, tab) {
  var t = detail.tabs && detail.tabs[tab];

function allTabGenerated(detail) {

  area.innerHTML = html;

function renderDetailEditor(detail) {

function rebindDetailEditor() {
  var area = document.getElementById('detailsArea');

function collectTabFields(detailId, tab) {
  var area = document.getElementById('detailsArea');
  var detail = studio.details.find(function (d) { return d.id === detailId; });
  var content = {};
  (sectionOf(tab)).forEach(function (k) {
    var ta = area.querySelector('textarea[data-field="' + k + '"]');
    if (ta) content[k] = ta.value;
  });
  var la = area.querySelector('textarea[data-field="lookAgain"]');
  if (la) content.lookAgain = la.value;
  return content;
}
function saveActiveTab() {
  var s = studio;
  var content = collectTabFields(s.activeDetailId, s.activeTab);
  var payload = Object.assign({}, content, { status: 'generated' });
  patch('/api/details/' + s.activeDetailId + '/content/' + s.activeTab, payload).then(function () {
    return api('/api/artworks/' + s.artworkId).then(function (full) {
      studio.details = full.details || [];
      renderDetailsPanel();
      toast('Contenuto salvato', true);
    });
  }).catch(function (e) { toast(e.message); });
}
function genTab(detailId, tab, btn) {
  if (!btn) btn = document.createElement('button');
  var old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  loadImage(studio.imageUrl).then(function (img) {
    var detail = studio.details.find(function (d) { return d.id === detailId; });
    if (!img || !detail) throw new Error('Immagine non disponibile');
    return cropDataUrl(img, detail.region, 900).then(function (crop) {
      return post('/api/details/' + detailId + '/generate/' + tab, { selectionImage: crop }).then(function () {
        return api('/api/artworks/' + studio.artworkId);
      }).then(function (full) {
        studio.details = full.details || [];
        renderDetailsPanel();
        toast('Tab "' + (tab === 'studio' ? 'Studio del dettaglio' : 'Approfondimento') + '" generata', true);
      });
    });

}
function renderOverviewPanel() {

function runOverview() {

function runSimilar() {

  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generazione…'; }

function saveSimilarWorks() {
  var area = document.getElementById('similarContent');
  if (!area) return;
  var cards = area.querySelectorAll('[data-sim]');
  var tasks = [];
  cards.forEach(function (card) {
    var id = card.getAttribute('data-sim');
    var patchBody = {};
    ['title', 'artist', 'date', 'museum', 'caption'].forEach(function (k) {
      var inp = card.querySelector('[data-sf="' + k + '"]');
      if (inp) patchBody[k] = inp.value;

    var urlInp = card.querySelector('[data-sf="imageUrl"]');
    if (urlInp && urlInp.value !== card.getAttribute('data-sim-url')) patchBody.imageUrl = urlInp.value;
    tasks.push(patch('/api/artworks/' + studio.artworkId + '/similar/' + id, patchBody));
  });
  Promise.all(tasks).then(function () { toast('Opere simili salvate', true); renderSimilarPanel(); })
    .catch(function (e) { toast('Salvataggio opere simili fallito: ' + e.message); });
}
function moveSimilar(idStr, dir) {

    var j = idx + dir;
    if (idx < 0 || j < 0 || j >= works.length) return;
    return Promise.all([
      patch('/api/artworks/' + studio.artworkId + '/similar/' + works[idx].id, { sortOrder: j }),
      patch('/api/artworks/' + studio.artworkId + '/similar/' + works[j].id, { sortOrder: idx })

function runSave() {
  collectMetaFromInputs();
  var s = studio;
  var btn = document.getElementById('btnSave');

        if (note && saveTotal) note.textContent = 'Genero ' + Math.min(doneSave, saveTotal) + '/' + saveTotal + ': "' + det.title + '"…';
        return cropDataUrl(img, det.region, 900).then(function (crop) {
          if (plan.needS && plan.needA) return post('/api/details/' + plan.detailId + '/generate/both', { selectionImage: crop });
          return post('/api/details/' + plan.detailId + '/generate/' + (plan.needS ? 'studio' : 'approfondimento'), { selectionImage: crop });
        });
      });
    }, 3).then(function () {
      // ricarica lo stato fresco dal server e riapplica le modifiche fatte negli editor
      return api('/api/artworks/' + s.artworkId);
    }).then(function (full) {
      s.details = full.details || [];
      var edits = state.fieldEdits || {};
      Object.keys(edits).forEach(function (did) {
        Object.keys(edits[did] || {}).forEach(function (tab) {
          var vals = edits[did][tab] || {};
          var rec = s.details.find(function (x) { return String(x.id) === String(did); });
          if (!rec || !rec.tabs || !rec.tabs[tab]) return;
          if (!rec.tabs[tab].content) rec.tabs[tab].content = {};
          Object.keys(vals).forEach(function (k) { rec.tabs[tab].content[k] = vals[k]; });
        });
      });
      var saves = [];
      s.details.forEach(function (d) {
        ['studio', 'approfondimento'].forEach(function (tab) {
          var t = d.tabs && d.tabs[tab];

    }).then(function () {

    }).then(function () {

      if (note) note.textContent = '';

}
function genPlans() {
  var s = studio;
  var plans = [];
  (s.details || []).forEach(function (d) {
    var needS = !detailReady(d, 'studio');
    var needA = !detailReady(d, 'approfondimento');
    if (needS || needA) plans.push({ detailId: d.id, title: d.title, needS: needS, needA: needA });
  });
  return plans;
}
function planTabCount(plans) {
  var n = 0;
  plans.forEach(function (p) { n += (p.needS ? 1 : 0) + (p.needA ? 1 : 0); });
  return n;
}
function runPool(tasks, fn, limit) {
  return new Promise(function (resolve, reject) {
    if (!tasks.length) return resolve();
    var i = 0, running = 0, failed = false, doneCount = 0;
    function launch() {
      while (running < (limit || 3) && i < tasks.length && !failed) {
        var t = tasks[i++];
        running += 1;
        fn(t).then(function () {
          running -= 1; doneCount += 1;
          if (doneCount === tasks.length) resolve();
          else launch();
        }, function (e) { failed = true; reject(e); });
      }
    }
    launch();
  });
}
function extractSections(body, tab) {
  var c = body && body.content;
  if (!c) return null;
  var row = (c.studio || c.approfondimento) ? (tab === 'studio' ? c.studio : c.approfondimento) : c;
  return row && row.content ? row.content : null;
}
function genAllLabel(done, total) {
  return '<span class="spinner"></span> Generazione ' + done + '/' + total;
}
function markDetailBadge(detailId, studioDone, apprDone) {
  var area = document.getElementById('detailsArea');
  if (!area) return;
  var st = area.querySelector('.detail-item[data-sel="' + detailId + '"] .st');

function runGenAll() {
  var s = studio;
  var note = document.getElementById('saveNote');
  var genBtn = document.getElementById('btnGenAll');
  var plans = genPlans();
  var totalTabs = planTabCount(plans);
  if (!totalTabs) { toast('Tutte le tab sono già generate', true); return; }
  if (genBtn) { genBtn.disabled = true; genBtn.innerHTML = genAllLabel(0, totalTabs); }
  if (note) note.textContent = 'Genero in parallelo ' + plans.length + ' dettagli (' + totalTabs + ' tab) — visione condivisa tra le due tab. ~1 minuto per ondata.';

  var doneTabs = 0;
  function bump(plan, nTabs) {
    doneTabs += nTabs;
    var shown = Math.min(doneTabs, totalTabs);
    if (genBtn) genBtn.innerHTML = genAllLabel(shown, totalTabs);
    if (note) note.textContent = 'Completate ' + shown + '/' + totalTabs + ' tab. Prossimi dettagli in elaborazione…';
    api('/api/artworks/' + s.artworkId).then(function (full) {
      s.details = full.details || [];
      var fresh = s.details.find(function (d) { return d.id === plan.detailId; });
      if (fresh) markDetailBadge(plan.detailId, detailReady(fresh, 'studio'), detailReady(fresh, 'approfondimento'));
    }).catch(function () {});
  }
  function fillVisibleEditor(plan, body) {
    if (s.activeDetailId !== plan.detailId) return;
    var content = extractSections(body, s.activeTab);
    if (!content) return;
    sectionOf(s.activeTab).forEach(function (k) {
      var ta = document.querySelector('textarea[data-field="' + k + '"]');
      if (ta) ta.value = content[k] || '';
    });
    var la = document.querySelector('textarea[data-field="lookAgain"]');
    if (la) la.value = content.lookAgain || '';
  }

  runPool(plans, function (plan) {
    var what = (plan.needS && plan.needA) ? 'entrambe le tab' : (plan.needS ? 'solo Studio del dettaglio' : 'solo Approfondimento');
    if (note) note.textContent = 'Elaboro: ' + plan.title + ' (' + what + ')…';
    return loadImage(s.imageUrl).then(function (img) {
      var det = s.details.find(function (x) { return x.id === plan.detailId; });
      if (!img || !det) return Promise.resolve(null);
      return cropDataUrl(img, det.region, 900).then(function (crop) {
        if (plan.needS && plan.needA) return post('/api/details/' + plan.detailId + '/generate/both', { selectionImage: crop });
        return post('/api/details/' + plan.detailId + '/generate/' + (plan.needS ? 'studio' : 'approfondimento'), { selectionImage: crop });
      });
    }).then(function (body) {
      bump(plan, (plan.needS ? 1 : 0) + (plan.needA ? 1 : 0));
      fillVisibleEditor(plan, body);
    });
  }, 3).then(function () {
    return api('/api/artworks/' + s.artworkId);
  }).then(function (full) {
    s.details = full.details || [];
    if (note) note.textContent = 'Tutti i contenuti generati — verifica e premi “Salva nel database”.';
    render();
    toast('Contenuti generati — verifica e salva', true);
  }).catch(function (e) { toast('Generazione fallita: ' + e.message); render(); });
}

function drawSpotOnCanvas(canvasId, src, details, selId) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  loadImage(src).then(function (img) {
    if (!img || !canvas) return;
    var sel = null;
    (details || []).forEach(function (d) { if (String(d.id) === String(selId)) sel = d; });
    var W = img.naturalWidth, H = img.naturalHeight;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    if (!sel || !sel.region) {
      ctx.filter = 'none';
      ctx.drawImage(img, 0, 0, W, H);
      return;
    }
    var r = sel.region;
    var x = Math.max(0, Math.min(W - 1, r.x * W));
    var y = Math.max(0, Math.min(H - 1, r.y * H));
    var w = Math.max(1, Math.min(W - x, r.width * W));
    var h = Math.max(1, Math.min(H - y, r.height * H));
    // base in scala di grigi
    ctx.filter = 'grayscale(1)';
    ctx.drawImage(img, 0, 0, W, H);
    ctx.filter = 'none';
    // ripristino a colori solo dentro la regione
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.drawImage(img, 0, 0, W, H);
    ctx.restore();
    // alone bianco + contorno colorato
    ctx.lineWidth = 9;
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#dc7056';
    ctx.strokeRect(x, y, w, h);
  });
}

function startBoxDrag(wrap, box, d, mode, e) {
  if (!d || !d.region) return;
  var r = d.region;
  var start = { x: r.x, y: r.y, w: r.width, h: r.height };
  function rect() { return wrap.getBoundingClientRect(); }
  var rect0 = rect();
  var px = (e.clientX - rect0.left) / rect0.width;
  var py = (e.clientY - rect0.top) / rect0.height;
  var saved = null;
  function round4(v) { return Math.round(v * 10000) / 10000; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function apply(cx, cy) {
    var rc = rect();
    var dx = (cx - rc.left) / rc.width - px;
    var dy = (cy - rc.top) / rc.height - py;
    var x = start.x, y = start.y, w = start.w, h = start.h;
    var MIN = 0.03;
    if (mode === 'move') {
      x = clamp(start.x + dx, 0, 1 - w);
      y = clamp(start.y + dy, 0, 1 - h);
    } else {
      if (mode.indexOf('w') >= 0) { var nxl = clamp(start.x + dx, 0, start.x + start.w - MIN); w = start.x + start.w - nxl; x = nxl; }
      if (mode.indexOf('e') >= 0) { w = clamp(start.w + dx, MIN, 1 - start.x); }
      if (mode.indexOf('n') >= 0) { var nyt = clamp(start.y + dy, 0, start.y + start.h - MIN); h = start.y + start.h - nyt; y = nyt; }
      if (mode.indexOf('s') >= 0) { h = clamp(start.h + dy, MIN, 1 - start.y); }
    }
    box.style.left = (x * 100) + '%';
    box.style.top = (y * 100) + '%';
    box.style.width = (w * 100) + '%';
    box.style.height = (h * 100) + '%';
    saved = { x: round4(x), y: round4(y), width: round4(w), height: round4(h) };
  }
  function up() {
    window.removeEventListener('pointermove', mv);
    window.removeEventListener('pointerup', up);
    if (saved) saveBoxRegion(d.id, saved);
  }
  function mv(ev) { ev.preventDefault(); apply(ev.clientX, ev.clientY); }
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up);
  apply(e.clientX, e.clientY);
}
function saveBoxRegion(detailId, region) {
  patch('/api/details/' + detailId, region).then(function () {
    var idx = studio.details.findIndex(function (x) { return x.id === detailId; });
    if (idx >= 0) studio.details[idx].region = region;
    toast('Riquadro aggiornato e salvato', true);
  }).catch(function (e) { toast('Salvataggio riquadro fallito: ' + e.message); });

function bindNewDraw(cap) {
  var wrap = document.querySelector('.spot-wrap');
  if (!wrap) return;
  var start = null, rectEl = null;
  function nx(cx) { var r = wrap.getBoundingClientRect(); return (cx - r.left) / r.width; }
  function ny(cy) { var r = wrap.getBoundingClientRect(); return (cy - r.top) / r.height; }
  function down(e) {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    e.preventDefault();
    start = { x: Math.max(0, Math.min(1, nx(e.clientX))), y: Math.max(0, Math.min(1, ny(e.clientY))) };
    rectEl = document.createElement('div');
    rectEl.className = 'bx nd-draw';
    rectEl.style.pointerEvents = 'none';
    // dentro l'overlay inset:0 (altezza definita): le % di altezza risolvono correttamente
    (cap.parentNode || wrap).appendChild(rectEl);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }
  function move(e) {
    if (!start || !rectEl) return;
    var x2 = Math.max(0, Math.min(1, nx(e.clientX)));
    var y2 = Math.max(0, Math.min(1, ny(e.clientY)));
    var x = Math.min(start.x, x2), y = Math.min(start.y, y2);
    var w = Math.abs(x2 - start.x), h = Math.abs(y2 - start.y);
    rectEl.style.left = (x * 100) + '%';
    rectEl.style.top = (y * 100) + '%';
    rectEl.style.width = (w * 100) + '%';
    rectEl.style.height = (h * 100) + '%';
  }
  function up() {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (!start || !rectEl) return;
    var wr = wrap.getBoundingClientRect();
    var rr = rectEl.getBoundingClientRect();
    rectEl.remove(); rectEl = null; start = null;
    var region = { x: (rr.left - wr.left) / wr.width, y: (rr.top - wr.top) / wr.height, width: rr.width / wr.width, height: rr.height / wr.height };
    if (!ndRectValid(region)) return toast('Riquadro troppo piccolo: allarga la selezione.');
    var r4 = function (v) { return Math.round(v * 10000) / 10000; };
    studio.newDetail.region = { x: r4(region.x), y: r4(region.y), width: r4(region.width), height: r4(region.height) };
    studio.newDetail.phase = 'panel';
    paintNewDetailView();
  }
  cap.addEventListener('pointerdown', down);
}

function bindGlobal() {
  appEl.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-tab]');
    if (tab) {
      e.preventDefault();
      var t = tab.getAttribute('data-tab');
      if (t === 'all' || t === 'artwork' || t === 'subject' || t === 'comparison' || t === 'cards') {
        if (state.homeTab === t) return;
        state.homeTab = t;
        state.homeRedraw = true;
        render();
        state.homeRedraw = false;
      }
      return;
    }
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      e.preventDefault();
      var dest = nav.getAttribute('data-nav');
      if (dest === 'home') { state.view = 'home'; state.pipeline = null; refreshList(); }
      else if (dest === 'new') { studio = new StudioView(); state.pipeline = null; state.view = 'studio'; render(); }
      else if (dest === 'new-subject') { subjectStudio = new SubjectStudioView(); state.pipeline = null; state.view = 'subject-studio'; render(); }
      else if (dest === 'new-comparison') { comparisonStudio = new ComparisonStudioView(); state.pipeline = null; state.view = 'comparison-studio'; render(); }
      else if (dest === 'new-card') { cardStudio = new CardStudioView(); state.view = 'card-studio'; render(); refreshCardMaterie(); }
      return;
    }
    var open = e.target.closest('[data-open]');
    if (open) { e.preventDefault(); openStudio(open.getAttribute('data-open')); return; }
    var view = e.target.closest('[data-view]');
    if (view) { e.preventDefault(); openViewer(view.getAttribute('data-view')); return; }
    var del = e.target.closest('[data-del]');
    if (del) { e.preventDefault(); removeArtwork(del.getAttribute('data-del')); return; }
    var os = e.target.closest('[data-open-subject]');
    if (os) { e.preventDefault(); openSubjectStudio(os.getAttribute('data-open-subject')); return; }
    var vs = e.target.closest('[data-view-subject]');
    if (vs) { e.preventDefault(); state.view = 'subject-viewer'; state.viewerSubjectId = vs.getAttribute('data-view-subject'); render(); return; }
    var ds = e.target.closest('[data-del-subject]');
    if (ds) { e.preventDefault(); removeSubject(ds.getAttribute('data-del-subject')); return; }
    var oc = e.target.closest('[data-open-comparison]');
    if (oc) { e.preventDefault(); openComparisonStudio(oc.getAttribute('data-open-comparison')); return; }
    var vc = e.target.closest('[data-view-comparison]');
    if (vc) { e.preventDefault(); state.view = 'comparison-viewer'; state.viewerComparisonId = vc.getAttribute('data-view-comparison'); render(); return; }
    var dc = e.target.closest('[data-del-comparison]');
    if (dc) { e.preventDefault(); removeComparison(dc.getAttribute('data-del-comparison')); return; }
    var ocg = e.target.closest('[data-open-card]');
    if (ocg) { e.preventDefault(); openCardStudio(ocg.getAttribute('data-open-card')); return; }
    var dcg = e.target.closest('[data-del-card]');
    if (dcg) { e.preventDefault(); removeCard(dcg.getAttribute('data-del-card')); return; }
    var pipe = e.target.closest('[data-pipe]');
    if (pipe) {
      e.preventDefault();
      if (pipe.getAttribute('data-pipe') === 'retry') pipeRetry();
      else if (pipe.getAttribute('data-pipe') === 'cancel') pipeCancel();
      return;
    }
  });
}

function cardSetPath(s, path, value) {
  // path "chiave:lista:indice:campo" oppure "chiave:lato:campo"
  var parts = path.split(':');
  var key = parts[0];
  if (parts.length === 1) return;
  if (parts.length === 3 && (parts[1] === 'a' || parts[1] === 'b')) {
    s.corpi[key][parts[1]][parts[2]] = value;
    return;
  }
  var arr = s.corpi[key][parts[1]];
  var idx = Number(parts[2]);
  if (arr && arr[idx]) arr[idx][parts[3]] = value;
}

function refreshCardSection(s, key) {
  var def = (s.modello.schema.sections || []).find(function (d) { return d.key === key; });
  var el = document.getElementById('cs-ed-' + key);
  if (def && el) { el.innerHTML = cardSectionEditor(s, def); bindCardStudio(s); }
}
function cardSaveSection(s, key, btn) {
  var old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  patch('/api/cards/' + encodeURIComponent(s.id) + '/sections/' + encodeURIComponent(key), { corpo: s.corpi[key] }).then(function (r) {
    s.corpi[key] = (r.section && r.section.corpo) || s.corpi[key];
    toast('Sezione salvata', true);
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  }).catch(function (e) { toast(e.message); if (btn) { btn.disabled = false; btn.innerHTML = old; } });
}
function cardGenSection(s, key, btn) {
  var old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  post('/api/cards/' + encodeURIComponent(s.id) + '/generate/' + encodeURIComponent(key), {}).then(function (r) {
    if (r.section && r.section.corpo) s.corpi[key] = r.section.corpo;
    if (r.warnings && r.warnings.length) toast('Generata con avvisi: ' + r.warnings.join('; '));
    else toast('Sezione generata', true);
    refreshCardSection(s, key);
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  }).catch(function (e) { toast(e.message); if (btn) { btn.disabled = false; btn.innerHTML = old; } });
}
function cardGenAll(s, btn) {
  var defs = (s.modello.schema.sections || []).filter(function (d) { return d.type !== 'image'; });
  var i = 0;
  btn.disabled = true;
  var step = function () {
    if (i >= defs.length) { btn.disabled = false; btn.innerHTML = '⚡ Genera tutte le sezioni'; toast('Generazione completa: rivedi e salva', true); render(); return; }
    btn.innerHTML = '⚡ Generazione ' + (i + 1) + '/' + defs.length + '…';
    var key = defs[i].key;
    post('/api/cards/' + encodeURIComponent(s.id) + '/generate/' + encodeURIComponent(key), {}).then(function (r) {
      if (r.section && r.section.corpo) s.corpi[key] = r.section.corpo;
      i += 1;
      step();
    }).catch(function (e) { toast('Sezione ' + key + ': ' + e.message); i += 1; step(); });
  };
  step();
}

  var old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  post('/api/subjects/' + s.id + '/generate/' + step).then(function () {
    toast('Sezione generata', true);
    return api('/api/subjects/' + s.id);
  }).then(function (full) {
    applySubjectFull(full);
    render();
  }).catch(function (e) { toast('Generazione fallita: ' + e.message); }).then(function () {
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  });
}
function subGenAll() {
  var s = subjectStudio;
  if (!s || !s.id || s.genBusy) return;
  s.genBusy = true;
  var steps = ['intro', 'chapters', 'works', 'closing'];
  var labels = { intro: '1 · Apertura (introduzione e origini)', chapters: '2 · Evoluzione per epoche', works: '3 · Opere rappresentative (con immagini)', closing: '4 · Chiusura (simboli, interpretazioni, curiosità)' };
  var i = 0;
  var wrap = document.getElementById('subPipeWrap');
  function paint() {
    if (!wrap) return;
    var pct = Math.round(100 * i / steps.length);
    wrap.innerHTML = '<div class="card pipe-card"><div class="pipe-head"><span class="eyebrow">generazione automatica</span><span class="pipe-pct">' + pct + '%</span></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="pipe-activity">' + (i < steps.length ? '<span class="spinner"></span> ' + esc(labels[steps[i]]) : '✓ Tutti i contenuti generati') + '</div></div>';
  }
  paint();
  function next() {
    if (i >= steps.length) { s.genBusy = false; paint(); toast('Generazione completata — rivedi e premi Salva nel database', true); return; }
    post('/api/subjects/' + s.id + '/generate/' + steps[i]).then(function () {
      i++;
      return api('/api/subjects/' + s.id);
    }).then(function (full) {
      // Ricarica ogni step completato prima di proseguire: evita che il Salva
      // finale sovrascriva i contenuti generati con lo stato UI precedente.
      applySubjectFull(full);
      paint();
      render();
      wrap = document.getElementById('subPipeWrap');
      paint();
      next();
    }).catch(function (e) {
      s.genBusy = false;
      if (wrap) wrap.innerHTML = '<div class="card pipe-card err"><div class="pipe-head"><span class="eyebrow">generazione automatica</span><span class="pipe-pct">' + Math.round(100 * i / steps.length) + '%</span></div><div class="pipe-err">' + esc(e.message || 'Generazione interrotta') + '</div><div class="pipe-actions"><button class="btn small" data-subretry="1">⟳ Riprova</button></div></div>';
      var retry = document.querySelector('[data-subretry]');
      if (retry) retry.onclick = function () { s.genBusy = false; subGenAll(); };
      toast('Generazione interrotta: ' + (e.message || ''));
    });
  }
  next();
}
function saveSubjectCard() {
  var s = subjectStudio;
  if (!s || !s.id) return;
  patch('/api/subjects/' + s.id, {
    name: s.name, shortDesc: s.shortDesc, intro: s.intro, origins: s.origins,
    symbols: JSON.stringify(s.symbols), interpretations: s.interpretations, curiosities: s.curiosities,
    chapters: s.chapters,
    works: s.works.map(function (w) { return { id: w.id, title: w.title, artist: w.artist, date: w.date, museum: w.museum, caption: w.caption }; })
  }).then(function () {
    return post('/api/subjects/' + s.id + '/approve');
  }).then(function (body) {
    if (body.status === 'ready') { toast('Scheda soggetto salvata nel database', true); refreshList(); }
    else throw new Error('Approvazione non riuscita');
  }).catch(function (e) { toast('Salvataggio fallito: ' + e.message); });
}
function openSubjectStudio(id) {
  subjectStudio = new SubjectStudioView();

function removeSubject(id) {

/* ================= Studio FACCIA A FACCIA ================= */

function bindSidesStep(s) {
  appEl.querySelectorAll('[data-side-src]').forEach(function (sel) {
    sel.onchange = function () {
      var side = sel.getAttribute('data-side-src');
      s.sides[side].source = sel.value;
      renderComparisonStudio();
    };
  });
  appEl.querySelectorAll('[data-side-art]').forEach(function (sel) {
    sel.onchange = function () { s.sides[sel.getAttribute('data-side-art')].artworkId = sel.value; };
  });
  [['title', 'title'], ['artist', 'artist'], ['date', 'date'], ['museum', 'museum'], ['url', 'imageUrl']].forEach(function (pair) {
    appEl.querySelectorAll('[data-side-' + pair[0] + ']').forEach(function (inp) {
      inp.oninput = function () {
        var side = inp.getAttribute('data-side-' + pair[0]);
        s.sides[side][pair[1]] = inp.value;
        if (pair[0] === 'url') s.sides[side].imageDataUrl = '';
      };
    });
  });
  appEl.querySelectorAll('[data-side-file]').forEach(function (inp) {
    inp.onchange = function () {
      var side = inp.getAttribute('data-side-file');
      var file = inp.files[0];
      if (!file) return;
      fileToDataUrl(file).then(function (dataUrl) {
        s.sides[side].imageDataUrl = dataUrl;
        s.sides[side].imageUrl = '';
        var prev = document.querySelector('[data-side-preview="' + side + '"]');
        if (prev) prev.innerHTML = '<img class="side-preview" src="' + dataUrl + '" alt="" />';
      });
    };
  });
  var t = document.getElementById('cmpTitle'); if (t) t.oninput = function () { s.title = t.value; };
  var ty = document.getElementById('cmpType'); if (ty) ty.onchange = function () { s.comparisonType = ty.value; };
  var create = document.getElementById('cmpCreate');
  if (create) create.onclick = function () { createComparisonFromForm(s); };
}
function createComparisonFromForm(s) {
  for (var side of ['a', 'b']) {
    var x = s.sides[side];
    if (x.source === 'library' && !x.artworkId) return toast('Lato ' + side.toUpperCase() + ': scegli un’opera dal database');
    if (x.source === 'external' && !String(x.title || '').trim() && !x.imageDataUrl && !String(x.imageUrl || '').trim()) return toast('Lato ' + side.toUpperCase() + ': inserisci almeno titolo o immagine');
  }
  var title = s.title.trim() || ((s.sides.a.title || 'A') + ' vs ' + (s.sides.b.title || 'B')).trim() || 'Confronto';
  post('/api/comparisons', { title: title, comparison_type: s.comparisonType }).then(function (body) {
    if (!body.comparison || !body.comparison.id) throw new Error('Risposta non valida');
    s.id = body.comparison.id;
    var payload = {};
    ['a', 'b'].forEach(function (side) {
      var x = s.sides[side];
      if (x.source === 'library') payload[side] = { source: 'library', artworkId: x.artworkId };
      else payload[side] = { source: 'external', title: x.title, artist: x.artist, date: x.date, museum: x.museum, imageDataUrl: x.imageDataUrl || undefined, imageUrl: x.imageUrl || undefined };
    });
    return post('/api/comparisons/' + s.id + '/sides', payload);
  }).then(function () {
    return api('/api/comparisons/' + s.id);
  }).then(function (full) {
    applyComparisonFull(full);
    s.step = 'editor';
    toast('Confronto creato', true);
    render();
  }).catch(function (e) { toast('Creazione fallita: ' + e.message); });
}
function applyComparisonFull(full) {
  var s = comparisonStudio;
  if (!s) s = comparisonStudio = new ComparisonStudioView();
  s.id = full.id; s.title = full.title || ''; s.comparisonType = full.comparisonType || 'same-subject';
  s.intro = full.intro || ''; s.technique = full.technique || ''; s.context = full.context || ''; s.critique = full.critique || ''; s.curiosities = full.curiosities || '';
  s.points = { similar: [], different: [] };
  (full.points || []).forEach(function (p) { if (s.points[p.kind]) s.points[p.kind].push({ title: p.title, text: p.text }); });
  ['a', 'b'].forEach(function (side) {
    var x = (full.sides || []).find(function (sx) { return sx.side === side; }) || {};
    s.sides[side] = { source: x.source || 'external', artworkId: x.artworkId || '', title: x.title || '', artist: x.artist || '', date: x.date || '', museum: x.museum || '', imageUrl: x.imageUrl || '', imageDataUrl: '', imageStatus: x.imageStatus || '' };
  });
}
