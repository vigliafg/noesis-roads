function bindComparisonEditor(s) {
  var chg = document.getElementById('cmpChangeSides');
  if (chg) chg.onclick = function () { s.step = 'sides'; renderComparisonStudio(); };
  var t2 = document.getElementById('cmpTitle2'); if (t2) t2.oninput = function () { s.title = t2.value; };
  var ty2 = document.getElementById('cmpType2'); if (ty2) ty2.onchange = function () { s.comparisonType = ty2.value; };
  var intro = document.getElementById('cmpIntro'); if (intro) intro.oninput = function () { s.intro = intro.value; };
  [['cmpTechnique', 'technique'], ['cmpContext', 'context'], ['cmpCritique', 'critique'], ['cmpCuriosities', 'curiosities']].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    if (el) el.oninput = function () { s[pair[1]] = el.value; };
  });
  var gi = document.getElementById('cmpGenIntro'); if (gi) gi.onclick = function () { cmpGen('intro', gi); };
  var gp = document.getElementById('cmpGenPoints'); if (gp) gp.onclick = function () { cmpGen('points', gp); };
  var ga = document.getElementById('cmpGenAnalysis'); if (ga) ga.onclick = function () { cmpGen('analysis', ga); };
  appEl.querySelectorAll('[data-cmp-addpt]').forEach(function (b) {
    b.onclick = function () {
      var kind = b.getAttribute('data-cmp-addpt');
      s.points[kind].push({ title: '', text: '' });
      renderCmpPoints(s);
    };
  });
  var all = document.getElementById('cmpGenAll'); if (all) all.onclick = function () { cmpGenAll(); };
  var save = document.getElementById('cmpSave'); if (save) save.onclick = function () { saveComparisonCard(); };
  var delBtn = document.getElementById('cmpDelete'); if (delBtn) delBtn.onclick = function () { removeComparison(s.id); };
  renderCmpPoints(s);
}
function renderCmpPoints(s) {
  ['similar', 'different'].forEach(function (kind) {
    var el = document.getElementById(kind === 'similar' ? 'cmpSimilar' : 'cmpDifferent');
    if (!el) return;
    var list = s.points[kind] || [];
    var html = list.length ? '' : '<p class="step-note">Nessuna voce: genera o aggiungine una a mano.</p>';
    list.forEach(function (p, i) {
      html += '<div class="pt-row">' +
        '<input data-pt-title="' + kind + ':' + i + '" value="' + esc(p.title) + '" placeholder="Titolo breve" />' +
        '<textarea data-pt-text="' + kind + ':' + i + '" placeholder="Spiegazione…">' + esc(p.text) + '</textarea>' +
        '<button class="row-del" data-pt-del="' + kind + ':' + i + '">✕</button></div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('[data-pt-title]').forEach(function (inp) {
      inp.oninput = function () { var parts = inp.getAttribute('data-pt-title').split(':'); s.points[parts[0]][Number(parts[1])].title = inp.value; };
    });
    el.querySelectorAll('[data-pt-text]').forEach(function (ta) {
      ta.oninput = function () { var parts = ta.getAttribute('data-pt-text').split(':'); s.points[parts[0]][Number(parts[1])].text = ta.value; };
    });
    el.querySelectorAll('[data-pt-del]').forEach(function (b) {
      b.onclick = function () { var parts = b.getAttribute('data-pt-del').split(':'); s.points[parts[0]].splice(Number(parts[1]), 1); renderCmpPoints(s); };
    });
  });
}
function cmpGen(step, btn) {
  var s = comparisonStudio;
  if (!s || !s.id) return;
  var old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  post('/api/comparisons/' + s.id + '/generate/' + step).then(function () {
    toast('Sezione generata', true);
    return api('/api/comparisons/' + s.id);
  }).then(function (full) {
    applyComparisonFull(full);
    renderComparisonStudio();
  }).catch(function (e) { toast('Generazione fallita: ' + e.message); }).then(function () {
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  });
}
function cmpGenAll() {
  var s = comparisonStudio;
  if (!s || !s.id || s.genBusy) return;
  s.genBusy = true;
  var steps = ['intro', 'points', 'analysis'];
  var labels = { intro: '1 · Introduzione al confronto', points: '2 · Punti in comune e differenze', analysis: '3 · Analisi (tecnica, contesto, critica, curiosità)' };
  var i = 0;
  var wrap = document.getElementById('cmpPipeWrap');
  function paint() {
    if (!wrap) return;
    var pct = Math.round(100 * i / steps.length);
    wrap.innerHTML = '<div class="card pipe-card"><div class="pipe-head"><span class="eyebrow">generazione automatica</span><span class="pipe-pct">' + pct + '%</span></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="pipe-activity">' + (i < steps.length ? '<span class="spinner"></span> ' + esc(labels[steps[i]]) : '✓ Tutti i contenuti generati') + '</div></div>';
  }
  paint();
  function next() {
    if (i >= steps.length) { s.genBusy = false; paint(); toast('Generazione completata — rivedi e premi Salva nel database', true); return; }
    post('/api/comparisons/' + s.id + '/generate/' + steps[i]).then(function () {
      i++; paint(); next();
    }).catch(function (e) {
      s.genBusy = false;
      if (wrap) wrap.innerHTML = '<div class="card pipe-card err"><div class="pipe-head"><span class="eyebrow">generazione automatica</span><span class="pipe-pct">' + Math.round(100 * i / steps.length) + '%</span></div><div class="pipe-err">' + esc(e.message || 'Generazione interrotta') + '</div><div class="pipe-actions"><button class="btn small" data-cmprety="1">⟳ Riprova</button></div></div>';
      var retry = document.querySelector('[data-cmprety]');
      if (retry) retry.onclick = function () { s.genBusy = false; cmpGenAll(); };
      toast('Generazione interrotta: ' + (e.message || ''));
    });
  }
  next();
}
function saveComparisonCard() {
  var s = comparisonStudio;
  if (!s || !s.id) return;
  var points = [].concat(
    (s.points.similar || []).map(function (p) { return { kind: 'similar', title: p.title, text: p.text }; }),
    (s.points.different || []).map(function (p) { return { kind: 'different', title: p.title, text: p.text }; })
  );
  patch('/api/comparisons/' + s.id, {
    title: s.title, comparisonType: s.comparisonType, intro: s.intro, technique: s.technique,
    context: s.context, critique: s.critique, curiosities: s.curiosities, points: points
  }).then(function () {
    return post('/api/comparisons/' + s.id + '/approve');
  }).then(function (body) {
    if (body.status === 'ready') { toast('Scheda confronto salvata nel database' + (body.thumbWarning ? ' (' + body.thumbWarning + ')' : ''), true); refreshList(); }
    else throw new Error('Approvazione non riuscita');
  }).catch(function (e) { toast('Salvataggio fallito: ' + e.message); });
}
function openComparisonStudio(id) {
  comparisonStudio = new ComparisonStudioView();
  comparisonStudio.step = 'editor';
  state.pipeline = null;
  api('/api/comparisons/' + id).then(function (full) {
    applyComparisonFull(full);
    state.view = 'comparison-studio';
    render();
  }).catch(function (e) { toast(e.message); });
}
function removeComparison(id) {
  if (!confirm('Eliminare questa scheda di confronto dal database?')) return;
  del('/api/comparisons/' + id).then(function () { toast('Scheda eliminata', true); refreshList(); }).catch(function (e) { toast(e.message); });
}

/* ================= viewer SOGGETTO ================= */
function renderSubjectViewer() {
  var html = topbar('', '<button class="btn small" data-pdf onclick="downloadPdf(\'/api/subjects/\' + state.viewerSubjectId + \'/pdf\', \'scheda-soggetto.pdf\')">⬇ PDF</button><button class="btn small" data-nav="home">← Elenco</button>');
  html += '<div id="viewerBody"><div class="empty-state"><span class="spinner"></span> Caricamento…</div></div>';
  appEl.innerHTML = html;
  var b = appEl.querySelector('[data-nav]');
  if (b) b.onclick = function () { state.view = 'home'; refreshList(); };
  api('/api/subjects/' + state.viewerSubjectId).then(function (full) {
    if (!full.intro && !full.origins && !(full.chapters || []).length) { appEl.innerHTML = topbar('anteprima', '') + '<div class="empty-state"><h2>Soggetto non pronto</h2><p>Genera e salva prima i contenuti.</p></div>'; return; }
    var symbols = [];
    try { symbols = JSON.parse(full.symbols || '[]'); } catch (e) {}
    var h = '<div class="viewer-title"><span class="eyebrow">soggetto nella storia dell’arte</span><h1>' + esc(full.name) + '</h1><p class="meta">' + esc(full.shortDesc || '') + '</p></div>';
    h += '<div class="card" style="margin:18px 0"><div class="ov-grid">' +
      (full.intro ? '<div class="ov-col"><h4>Introduzione al soggetto</h4><p>' + esc(full.intro) + '</p></div>' : '') +
      (full.origins ? '<div class="ov-col"><h4>Origini e fonti iconografiche</h4><p>' + esc(full.origins) + '</p></div>' : '') + '</div></div>';
    if (full.chapters && full.chapters.length) {
      h += '<div class="card" style="margin:18px 0"><div class="step-head"><span class="eyebrow">Evoluzione per epoche</span></div><div class="timeline-view">';
      full.chapters.forEach(function (c) { h += '<div class="tl-item"><h4>' + esc(c.era) + '</h4><p>' + esc(c.text) + '</p></div>'; });
      h += '</div></div>';
    }
    if (full.works && full.works.length) {
      h += '<div class="card" style="margin:18px 0"><div class="step-head"><span class="eyebrow">Opere rappresentative</span></div><div class="sim-carousel"><button class="car-arrow" data-scroll="subSimTrack:-340">‹</button><div class="sim-track" id="subSimTrack"><div class="sim-track-inner">';
      full.works.forEach(function (w) {
        h += '<figure class="sim-slide">' + (w.imageUrl ? '<img class="sim-thumb-lg" src="' + esc(w.imageUrl) + '" alt="" loading="lazy" />' : '<div class="sim-ph-lg">🖼</div>') +
          '<figcaption><strong>' + esc(w.title) + '</strong><span>' + esc(w.artist || '') + (w.date ? ' · ' + esc(w.date) : '') + '</span>' + (w.museum ? '<small>' + esc(w.museum) + '</small>' : '') + (w.caption ? '<p>' + esc(w.caption) + '</p>' : '') + '</figcaption></figure>';
      });
      h += '</div></div><button class="car-arrow" data-scroll="subSimTrack:340">›</button></div></div>';
      setTimeout(function () {
        document.querySelectorAll('[data-scroll]').forEach(function (btn) {
          btn.onclick = function () {
            var parts = btn.getAttribute('data-scroll').split(':');
            var track = document.getElementById(parts[0]);
            if (track) track.scrollBy({ left: Number(parts[1]), behavior: 'smooth' });
          };
        });
      }, 0);
    }
    if (symbols.length) {
      h += '<div class="card" style="margin:18px 0"><div class="step-head"><span class="eyebrow">Attributi e simboli ricorrenti</span></div><div class="symbol-list">';
      symbols.forEach(function (sym) { h += '<div class="sym-item"><strong>' + esc(sym.symbol) + '</strong><span>' + esc(sym.meaning) + '</span></div>'; });
      h += '</div></div>';
    }
    h += '<div class="card" style="margin:18px 0"><div class="ov-grid">' +
      (full.interpretations ? '<div class="ov-col"><h4>Interpretazioni e varianti</h4><p>' + esc(full.interpretations) + '</p></div>' : '') +
      (full.curiosities ? '<div class="ov-col"><h4>Curiosità e questioni aperte</h4><p>' + esc(full.curiosities) + '</p></div>' : '') + '</div></div>';
    document.getElementById('viewerBody').innerHTML = h;
  }).catch(function () { appEl.innerHTML = '<div class="empty-state">Errore di caricamento</div>'; });
}

/* ================= viewer FACCIA A FACCIA ================= */
function renderComparisonViewer() {
  var html = topbar('', '<button class="btn small" data-pdf onclick="downloadPdf(\'/api/comparisons/\' + state.viewerComparisonId + \'/pdf\', \'scheda-confronto.pdf\')">⬇ PDF</button><button class="btn small" data-nav="home">← Elenco</button>');
  html += '<div id="viewerBody"><div class="empty-state"><span class="spinner"></span> Caricamento…</div></div>';
  appEl.innerHTML = html;
  var b = appEl.querySelector('[data-nav]');
  if (b) b.onclick = function () { state.view = 'home'; refreshList(); };
  api('/api/comparisons/' + state.viewerComparisonId).then(function (full) {
    var a = (full.sides || []).find(function (s) { return s.side === 'a'; }) || {};
    var bb = (full.sides || []).find(function (s) { return s.side === 'b'; }) || {};
    if (!full.intro && !(full.points || []).length) { appEl.innerHTML = topbar('anteprima', '') + '<div class="empty-state"><h2>Confronto non pronto</h2><p>Genera e salva prima i contenuti.</p></div>'; return; }
    var h = '<div class="viewer-title"><span class="eyebrow">' + (full.comparisonType === 'same-artist' ? 'stesso artista, fasi diverse' : 'stesso soggetto, artisti diversi') + '</span><h1>' + esc(full.title || 'Confronto') + '</h1></div>';
    h += '<div class="card" style="margin:18px 0"><div class="cmp-side-card">';
    [[a, 'A'], [bb, 'B']].forEach(function (pair) {
      var x = pair[0], side = pair[1];
      h += '<div class="side-half">' + (x.imageUrl ? '<img src="' + esc(x.imageUrl) + '" alt="" />' : '<div class="sim-ph">🖼</div>') +
        '<div class="cap"><span class="eyebrow">Opera ' + side + '</span><strong>' + esc(x.title || '?') + '</strong><span>' + esc(x.artist || '') + (x.date ? ' · ' + esc(x.date) : '') + (x.museum ? ' · ' + esc(x.museum) : '') + '</span></div></div>';
    });
    h += '</div></div>';
    if (full.intro) h += '<div class="card" style="margin:18px 0"><div class="ov-col"><h4>Introduzione al confronto</h4><p>' + esc(full.intro) + '</p></div></div>';
    var similar = (full.points || []).filter(function (p) { return p.kind === 'similar'; });
    var different = (full.points || []).filter(function (p) { return p.kind === 'different'; });
    if (similar.length) {
      h += '<div class="card" style="margin:18px 0"><div class="step-head"><span class="eyebrow" style="color:var(--green)">Punti in comune</span></div>';
      similar.forEach(function (p) { h += '<div class="cmp-point-list"><div class="cmp-point"><strong>' + esc(p.title) + '</strong><span>' + esc(p.text) + '</span></div></div>'; });
      h += '</div>';
    }
    if (different.length) {
      h += '<div class="card" style="margin:18px 0"><div class="step-head"><span class="eyebrow">Differenze</span></div>';
      different.forEach(function (p) { h += '<div class="cmp-point-list"><div class="cmp-point different"><strong>' + esc(p.title) + '</strong><span>' + esc(p.text) + '</span></div></div>'; });
      h += '</div>';
    }
    h += '<div class="card" style="margin:18px 0"><div class="ov-grid">' +
      (full.technique ? '<div class="ov-col"><h4>Tecnica a confronto</h4><p>' + esc(full.technique) + '</p></div>' : '') +
      (full.context ? '<div class="ov-col"><h4>Contesto storico-artistico</h4><p>' + esc(full.context) + '</p></div>' : '') +
      (full.critique ? '<div class="ov-col"><h4>Interpretazione critica</h4><p>' + esc(full.critique) + '</p></div>' : '') +
      (full.curiosities ? '<div class="ov-col"><h4>Curiosità</h4><p>' + esc(full.curiosities) + '</p></div>' : '') + '</div></div>';
    document.getElementById('viewerBody').innerHTML = h;
  }).catch(function () { appEl.innerHTML = '<div class="empty-state">Errore di caricamento</div>'; });
}

/* ================= boot ================= */
bindGlobal();
api('/api/status').then(function (s) {
  if (!s.configured) toast('Chiave OpenRouter non configurata: le generazioni non funzioneranno');
});
refreshList();
</script>
