<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>noesis-roads-creator · crea le schede didattiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#17344a;--muted:#6b7a83;--paper:#f6f3ee;--white:#fffdf9;--line:#dedbd3;--coral:#dc7056;--mustard:#e2ac44;--green:#628f80;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;background:var(--paper)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;letter-spacing:-.04em}
.app{max-width:1200px;margin:0 auto;padding:0 28px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.topbar .left{display:flex;align-items:center;gap:16px}
.topbar .hub-btn{border-color:var(--ink);color:var(--ink)}
.topbar .hub-btn:hover{border-color:var(--coral);color:var(--coral)}
.topbar-title{margin:0 0 18px;font-size:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:19px;font-weight:700}
.brand-mark{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.brand-mark i{display:block;width:6px;height:16px;border-radius:5px;transform:rotate(35deg);background:var(--coral)}
.brand-mark i:nth-child(2){height:20px;background:var(--mustard)}
.brand-mark i:nth-child(3){height:13px;background:var(--ink)}
.topbar .right{display:flex;align-items:center;gap:14px}
.eyebrow{color:var(--coral);text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.16em}
.page-title{font-size:38px;margin:8px 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.6;max-width:640px}
.btn{border:0;border-radius:6px;padding:12px 18px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:11px;border-radius:5px}
.card{background:var(--white);border:1px solid #e5e2dc;border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(30,42,44,.04)}
.banner{background:#fdf1e8;border:1px solid #f0d5c3;border-radius:12px;padding:14px 18px;color:#8a5a3a;font-size:12px;margin-bottom:22px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:#eef6f1;border-color:#cfe5da;color:#47715f}
.grid-artworks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.aw-card{border:0;background:var(--white);border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;text-align:left;padding:0;box-shadow:0 6px 18px rgba(30,42,44,.04)}
.aw-card .thumb{height:170px;background:#eee9e1;overflow:hidden;position:relative}
.aw-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--white);border-radius:20px;padding:5px 9px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.badge.ready{color:#47715f}
.aw-card .body{padding:14px 16px}
.aw-card .body h3{margin:0 0 4px;font-size:19px}
.aw-card .body p{margin:0;color:var(--muted);font-size:11px}
.aw-card .actions{display:flex;gap:8px;padding:0 16px 14px}
.aw-card .actions .btn{flex:1;justify-content:center}
/* ---------- workspace ---------- */
.ws-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:22px;align-items:start}
.dropzone{border:2px dashed var(--line);border-radius:14px;background:var(--white);padding:38px 24px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
.dropzone:hover,.dropzone.over{border-color:var(--coral);background:#fff9f5}
.dropzone .dz-icon{font-size:34px;margin-bottom:8px}
.dropzone p{margin:4px 0;font-size:12px}
.image-stage{position:relative;border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;background:#eee9e1}
.image-stage img{width:100%;display:block}
.image-stage .region-overlay{position:absolute;border:2px solid var(--coral);background:rgba(220,112,86,.08);border-radius:2px;pointer-events:none}
.image-stage .region-overlay span{position:absolute;top:-20px;left:0;background:var(--coral);color:#fff;font-size:9px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.detail-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.detail-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--white);cursor:pointer;transition:.15s}
.detail-item:hover{border-color:var(--coral)}
.detail-item.active{border-color:var(--coral);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.detail-item .n{color:var(--coral);font-weight:700;font-size:11px;margin-top:1px}
.detail-item .d strong,.detail-item .d small{display:block}
.detail-item .d strong{font-size:12px}
.detail-item .d small{color:var(--muted);font-size:10px;margin-top:3px}
.detail-item .st{margin-left:auto;font-size:9px;color:var(--green);white-space:nowrap;font-weight:700;text-transform:uppercase}
/* ---------- forms ---------- */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--white);padding:9px 11px;font-size:12px;color:var(--ink)}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
/* ---------- contenuti ---------- */
.content-tabs{display:flex;gap:8px;margin:14px 0 12px}
.ctab{flex:1;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:10px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.ctab.active{border-color:var(--coral);color:var(--ink);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.section-block{border-top:1px solid var(--line);padding:11px 0}
.section-block h4{font-family:'DM Sans';font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);margin:0 0 6px}
.section-block textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.55;min-height:66px;resize:vertical;background:var(--white)}
.section-block.look textarea{min-height:40px;background:var(--paper)}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.step-note{color:var(--muted);font-size:11px;margin:6px 0 0}
.progress{height:6px;background:#eeeae3;border-radius:4px;overflow:hidden;margin:14px 0 8px}
.progress i{display:block;height:100%;background:var(--coral);border-radius:4px;transition:width .4s}
.log-line{font-size:11px;color:var(--muted);padding:2px 0;display:flex;gap:8px;align-items:center}
.log-line.done{color:#47715f}
.log-line .dot{width:6px;height:6px;border-radius:50%;background:var(--mustard);flex-shrink:0}
.log-line.done .dot{background:var(--green)}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.pipe-card{border-left:4px solid var(--coral);margin-bottom:18px}
.pipe-card.ok{border-left-color:var(--green);background:#fbfdf9}
.pipe-card.err{border-left-color:#b03a2e}
.pipe-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pipe-pct{font-size:30px;font-weight:800;font-family:'Playfair Display',Georgia,serif;color:var(--coral);line-height:1}
.pipe-card.ok .pipe-pct{color:var(--green)}
.pipe-activity{font-size:12px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600;line-height:1.5}
.pipe-err{font-size:12px;color:#a33a2a;background:#fbeae7;border-radius:8px;padding:9px 12px;line-height:1.5}
.pipe-done-note{font-size:12px;color:var(--green);margin:8px 0 0;line-height:1.6}
.pipe-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pipe-phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.pipe-chip{font-size:10px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:20px;opacity:.75}
.pipe-chip.act{color:var(--coral);border-color:var(--coral);opacity:1;background:#fff9f5}
.pipe-chip.done{color:#47715f;border-color:#cfe5da;background:#eef6f1;opacity:1}
.img-panel{display:grid;grid-template-columns:minmax(0,4fr) minmax(160px,1fr);gap:14px;align-items:start}
.spot-wrap{position:relative;border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;background:#eee9e1;line-height:0}
.spot-wrap canvas{width:100%;height:auto;display:block}
.cap-rail{background:var(--white);border:1px solid #e5e2dc;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;max-height:540px;overflow:auto}
.rail-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--coral);margin:0 2px 2px}
.cap{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--ink);transition:.15s}
.cap:hover{border-color:var(--coral);background:#fff9f5}
.cap .num{color:var(--coral);font-weight:700;font-size:12px;min-width:16px;padding-top:1px}
.cap .cap-t{font-size:11.5px;line-height:1.35;font-weight:600}
.cap .cap-c{display:block;font-size:9px;color:var(--muted);font-weight:500;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.cap.on{border-color:var(--coral);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.spot-hint{font-size:10px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.spot-edit{position:absolute;inset:0;pointer-events:none;z-index:3}
.spot-edit .bx{position:absolute;border:2px dashed rgba(220,112,86,.9);pointer-events:auto;cursor:move;touch-action:none}
.spot-edit .bx.on{border:2px solid var(--coral);background:rgba(220,112,86,.10)}
.spot-edit .bx-lab{position:absolute;top:4px;left:4px;background:var(--coral);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;line-height:1.4;pointer-events:none;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
.spot-edit .bx.on .bx-lab{background:var(--ink)}
.spot-edit .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--coral);border-radius:3px;pointer-events:auto;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.spot-edit .h.nw{left:-7px;top:-7px;cursor:nwse-resize}
.spot-edit .h.n{left:50%;top:-7px;margin-left:-6px;cursor:ns-resize}
.spot-edit .h.ne{right:-7px;top:-7px;cursor:nesw-resize}
.spot-edit .h.e{right:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.spot-edit .h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.spot-edit .h.s{left:50%;bottom:-7px;margin-left:-6px;cursor:ns-resize}
.spot-edit .h.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.spot-edit .h.w{left:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.nd-overlay{z-index:6}
.nd-capture{position:absolute;inset:0;z-index:7;cursor:crosshair;pointer-events:auto;touch-action:none}
.nd-tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:8;background:rgba(23,52,74,.88);color:#fff;font-size:11px;font-weight:600;padding:7px 14px;border-radius:20px;pointer-events:none;white-space:nowrap}
.nd-draw{border:2px dashed var(--coral);background:rgba(220,112,86,.10)}
.bx.nd-new{border-style:solid;background:rgba(220,112,86,.10)}
.nd-panel{background:var(--white);border:1px solid #f0c9bc;border-left:4px solid var(--coral);border-radius:12px;padding:14px 16px;margin:12px 0 2px;box-shadow:0 6px 18px rgba(30,42,44,.06)}
.nd-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nd-p{font-size:12px;color:var(--ink);line-height:1.5;display:inline-flex;gap:8px;align-items:center}
.nd-field-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.nd-field-row .field{margin:0}
.nd-chip{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;margin-top:10px;display:inline-block}
.nd-chip.ok{background:#eef6f1;color:#47715f;border:1px solid #cfe5da}
.nd-chip.warn{background:#fdf6e8;color:#8a6a2f;border:1px solid #ecd9b0}
.nd-banner{border-radius:10px;padding:12px 14px;margin:2px 0 12px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.55;border:1px solid}
.nd-banner .nd-ico{font-size:16px;line-height:1.3}
.nd-banner strong{font-size:12px;display:block}
.nd-banner p{margin:3px 0 0;font-size:11.5px}
.nd-banner.complete{background:#eef6f1;border-color:#cfe5da;color:#35624e}
.nd-banner.partial{background:#fdf6e8;border-color:#ecd9b0;color:#7a5d22}
.nd-banner.insufficient{background:#fbeae7;border-color:#ecc9c2;color:#8f3123}
.nd-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media(max-width:760px){.img-panel{grid-template-columns:1fr}.cap-rail{max-height:200px}}
/* feedback salvataggio */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d5a43;color:#fff;padding:15px 24px;border-radius:30px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.25);transition:.35s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- viewer ---------- */
.viewer-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:22px;align-items:start}
.viewer-title h1{font-size:42px;margin:6px 0 6px}
.viewer-title .meta{color:var(--muted);font-size:12px;margin:0}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ov-col h4{font-family:'DM Sans';font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--coral);margin:0 0 8px}
.ov-col p{font-size:12px;line-height:1.7;margin:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:22px;margin:0}
.confidence{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;padding:6px 10px;border-radius:20px;background:#e6eef0;color:#47717c}
.hotspot-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hchip{border:1px solid var(--line);background:var(--white);border-radius:30px;padding:8px 13px;font-size:11px;color:var(--ink)}
.hchip.active{border-color:var(--coral);background:#fff9f5;color:var(--coral);font-weight:700}
.sources a{display:block;color:var(--ink);text-decoration:none;font-size:11px;padding:3px 0}
.sources span{color:var(--muted);font-size:9px}
.muted-note{color:var(--muted);font-size:9px;line-height:1.5;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state h2{color:var(--ink);font-size:26px}
@media(max-width:900px){.ws-layout,.viewer-layout{grid-template-columns:1fr}.meta-grid,.ov-grid{grid-template-columns:1fr}.app{padding:0 14px 60px}}
/* ---- Passo 4 · Opere simili ---- */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sim-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.sim-thumb{width:100%;height:150px;object-fit:cover;display:block;background:#eeeae3}
.sim-ph{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#eeeae3;color:var(--muted);font-size:11px;text-align:center;padding:10px;box-sizing:border-box}
.sim-fields{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sim-fields label{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.sim-fields input,.sim-fields textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12px;font-family:inherit;background:var(--white);color:var(--ink);box-sizing:border-box}
.sim-fields textarea{min-height:52px;resize:vertical}
.sim-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sim-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
.sim-status{margin-left:auto;color:var(--muted);font-size:9px}
/* carousel viewer */
.sim-carousel{display:flex;align-items:center;gap:8px;padding:6px 0}
.car-arrow{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.car-arrow:hover{border-color:var(--coral);color:var(--coral)}
.sim-track{flex:1;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.sim-track-inner{display:flex;gap:14px;min-width:max-content}
.sim-slide{flex:0 0 230px;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white);scroll-snap-align:start}
.sim-slide a{display:block}
.sim-thumb-lg{width:100%;height:150px;object-fit:cover;display:block;background:#eeeae3}
.sim-ph-lg{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#eeeae3;color:var(--muted);font-size:11px;text-align:center;padding:10px;box-sizing:border-box}
.sim-slide figcaption{padding:10px 12px}
.sim-slide figcaption strong{display:block;font-size:13px;line-height:1.3;color:var(--ink)}
.sim-slide figcaption span,.sim-slide figcaption small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.sim-slide figcaption p{margin:7px 0 0;color:var(--ink);font-size:11px;line-height:1.5}
/* ---- Schede Soggetto e Faccia a faccia ---- */
/* Filtri a tab della home (come il catalogo del viewer) */
.home-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px}
.home-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:30px;padding:9px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s}
.home-tab:hover{border-color:var(--coral);background:#fff9f5}
.home-tab.active{border-color:var(--coral);background:var(--coral);color:#fff}
.home-tab .tab-count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--paper);color:var(--muted);font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.home-tab.active .tab-count{background:rgba(255,255,255,.25);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:transparent;padding:8px 13px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.45;cursor:default}
.lvl-badge{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:20px;padding:3px 8px;color:var(--muted);background:var(--white);margin-left:8px;vertical-align:middle}
.lvl-badge.stale{border-color:var(--coral);color:var(--coral)}
.type-tag.tag-btn{cursor:pointer;font:inherit;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.type-tag.tag-btn:hover{background:#fff9f5}
.type-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 14px}
.type-head h2{margin:0;font-size:26px}
.type-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--coral);border:1px solid #e8c5ba;border-radius:20px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}

<body>

<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= stato ================= */
var state = { view: 'home', list: [], cards: [], materie: [], modelliPerMateria: {}, modelliTutti: {}, dupFor: null, busy: {}, log: [] };

/* ================= api ================= */
function api(path, opts) {
  // Timeout client: una richiesta appesa non deve bloccare la pipeline per sempre.
  var o = Object.assign({ signal: AbortSignal.timeout(150000) }, opts || {});
  return fetch(path, o).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      if (!res.ok) { var e = new Error((body.error && body.error.message) || ('HTTP ' + res.status)); e.status = res.status; e.body = body; throw e; }
      return body;
    });
  });
}
function post(path, body) { return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function put(path, body) { return api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function patch(path, body) { return api(path, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function del(path) { return api(path, { method: 'DELETE' }); }

/* esporta la scheda corrente come PDF "libro d'arte" */
function downloadPdf(path, fallbackName) {
  var btn = document.querySelector('[data-pdf]');
  var old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  toast('Generazione del PDF in corso…');
  fetch(path).then(function (res) {
    if (!res.ok) return res.json().catch(function () { return {}; }).then(function (b) { throw new Error((b.error && b.error.message) || ('HTTP ' + res.status)); });
    var cd = res.headers.get('content-disposition') || '';
    var m = cd.match(/filename="?([^";]+)"?/);
    return res.blob().then(function (blob) { return { blob: blob, name: m ? m[1] : (fallbackName || 'scheda.pdf') }; });
  }).then(function (r) {
    var url = URL.createObjectURL(r.blob);
    var a = document.createElement('a');
    a.href = url; a.download = r.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('PDF generato: ' + r.name, true);
  }).catch(function (e) {
    toast('PDF non generato: ' + e.message);
  }).then(function () {
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  });
}

/* ================= util ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.innerHTML = (ok ? '✓ ' : '⚠ ') + esc(msg);
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 4000);
}
function toastUndo(msg, label, onUndo) {
  var el = document.getElementById('toast');
  el.innerHTML = '✓ ' + esc(msg) + ' <button class="btn small" id="toastUndoBtn" style="margin-left:8px">' + esc(label || 'Annulla') + '</button>';
  el.classList.add('show');
  var done = false;
  var hide = function () { if (!done) { done = true; el.classList.remove('show'); } };
  document.getElementById('toastUndoBtn').onclick = function () { hide(); onUndo(); };
  setTimeout(hide, 8000);
}
function fileToDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
/* ================= render ================= */
var appEl = document.getElementById('app');

function render() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'card-studio') return renderCardStudio();
  if (state.view === 'materia-wizard') return renderMateriaWizard();
  if (state.view === 'talk') return renderTalk();
}
function topbar(title, rightHtml) {
  // «← Hub» a SINISTRA accanto al brand: navigazione primaria, separata dalle
  // azioni contestuali di pagina a destra («← Elenco», «⬇ PDF»), che restano le
  // uniche voci sulla destra. Il titolo di pagina (title) torna sotto la barra
  // come h1 visibile (page-title), più immediato dell'occhiello nell'header.
  var hub = (window.CREATOR_DATA && window.CREATOR_DATA.hubUrl) || ('http://' + (location.hostname || '127.0.0.1') + ':18080/');
  var right = rightHtml || '';
  var h1 = title ? '<h1 class="page-title topbar-title">' + esc(title) + '</h1>' : '';
  return '<header class="topbar"><div class="left"><a class="brand" href="#" data-nav="home"><span class="brand-mark"><i></i><i></i><i></i></span>noesis-roads-creator</a>' +
    '<button class="btn small ghost hub-btn" onclick="location.href=' + JSON.stringify(hub).replace(/"/g, '&quot;') + '">← Hub</button></div>' +
    '<div class="right">' + right + '</div></header>' + h1;
}

/* ---------- home ---------- */
function homeMateriaName(id) {
  var m = (state.materie || []).find(function (x) { return x.id === id; });
  return (m && m.nome) || id;
}
function homeStdModels(materiaId) {
  // Modelli utilizzabili per creare schede: con sezioni, non nascosti (niente versioni).
  return (state.modelliPerMateria[materiaId] || []).filter(function (m) {
    return !((m.schema || {}).nascondiCreazione) && (((m.schema || {}).sections || []).length > 0);
  });
}
function homeCardsOf(modelId, stato) {
  return (state.cards || []).filter(function (c) { return c.modelloId === modelId && (!stato || c.stato === stato); });
}
function modelSid(m) {
  return m.id || (m.materiaId + ':' + m.chiave);
}
function fasciaModelli() {
  var html = '<div class="card" style="margin-bottom:18px"><div class="step-head"><span class="eyebrow">📐 Fascia modelli — gli stampi</span></div>' +
    '<p class="step-note">Dicono cosa contiene una scheda. Si toccano di rado: <strong>solo qui</strong> nascono e si modificano i modelli.</p>';
  if (!state.materie.length) html += '<p class="step-note">Nessuna materia: creala da “+ Nuova materia”.</p>';
  if (!state.materie.length) html += '<p class="step-note">Nessuna materia: creala da “+ Nuova materia”.</p>';
  else {
    html += '<div class="fascia-row">';
    state.materie.forEach(function (m) {
    var mh = '<div class="fascia-mat">';
    var modelli = state.modelliTutti[m.id] || state.modelliPerMateria[m.id] || [];
    mh += '<h3>📚 ' + esc(m.nome || m.id) + '</h3>';
    if (!modelli.length) {
      mh += '<p class="step-note">Ancora nessun modello: creane uno col bottone qui sotto.</p>';
    } else {
      var visti = {};
      modelli.forEach(function (mod) {
        var k = mod.chiave || modelSid(mod);
        if (visti[k]) return;
        visti[k] = true;
        var sid = modelSid(mod);
        var nSchede = (state.cards || []).filter(function (c) { return c.modelloId === sid; }).length;
        mh += '<div class="fascia-item"><div class="fascia-item-head"><strong>' + esc(mod.nome || mod.chiave) + '</strong></div>' +
          '<div class="fascia-item-actions"><button class="btn small" data-edit-model="' + esc(sid) + '">✎ Modifica modello</button>' +
          '<button class="btn small ghost" data-dup-model="' + esc(sid) + '" title="Duplica: crea un nuovo modello dalla struttura di questo (save as)">⧉ Duplica</button>' +
          '<button class="btn small ghost" data-del-model="' + esc(sid) + '" data-del-model-nome="' + esc(mod.nome || mod.chiave) + '" title="Elimina il modello (solo se senza schede)">🗑</button></div>' +
          (state.dupFor === sid ? '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><input type="text" id="dupNome" value="' + esc((mod.nome || mod.chiave) + ' (copia)') + '" maxlength="80" style="flex:2;min-width:140px" />' +
          '<select id="dupMateria" title="Materia di destinazione">' +
          state.materie.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === m.id ? ' selected' : '') + '>' + esc(x.nome || x.id) + '</option>'; }).join('') +
          '</select>' +
          '<button class="btn small primary" data-dup-confirm="' + esc(sid) + '">Crea copia</button>' +
          '<button class="btn small ghost" data-dup-cancel>Annulla</button></div>' +
          '<p class="talk-note">In un\u2019altra materia i testi vengono adattati dall\u2019AI.</p>' : '') + '</div>';
      });
    }
    mh += '<div style="display:flex;gap:6px;margin:6px 0 4px"><button class="btn small ghost" style="flex:1" data-new-model-talk="' + esc(m.id) + '">＋ Nuovo modello guidato</button>' +
      '<button class="btn small ghost" data-del-materia="' + esc(m.id) + '" data-del-materia-nome="' + esc(m.nome || m.id) + '" title="Elimina la materia (solo se senza modelli)">🗑</button></div>';
    mh += '</div>';
    html += mh;
    });
    html += '</div>';
  }
  return html + '</div>';
}
function fasciaSchede() {
  var html = '<div class="card" id="fascia-schede" style="margin-bottom:18px"><div class="step-head"><span class="eyebrow">➕ Crea schede</span></div>' +
    '<p class="step-note">Scegli il modello e parti: la bozza la riempi con l’AI. Appena creata, la trovi in Lezioni con il marchio <strong>draft</strong>.</p>';
  if (!state.materie.length) html += '<p class="step-note">Nessuna materia.</p>';
  else {
    html += '<div class="fascia-row">';
    state.materie.forEach(function (m) {
    var mh = '<div class="fascia-mat">';
    var std = homeStdModels(m.id);
    mh += '<h3>📚 ' + esc(m.nome || m.id) + '</h3>';
    if (!std.length) {
      mh += '<p class="step-note">Ancora nessun modello utilizzabile in questa materia.</p>';
    } else {
      std.forEach(function (mod) {
        var sid = modelSid(mod);
        mh += '<div style="margin-bottom:10px"><button class="btn small primary" style="width:100%" data-new-model="' + esc(sid) + '">＋ Nuova scheda «' + esc(mod.nome || mod.chiave) + '»</button></div>';
      });
    }
    mh += '</div>';
    html += mh;
    });
    html += '</div>';
  }
  return html + '</div>';
}
function goFasciaSchede() {
  // Unica porta d'ingresso: la fascia Crea schede (niente più studio vuoto).
  var scroll = function () {
    var tries = 0;
    var tick = function () {
      var el = document.getElementById('fascia-schede');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      if (++tries < 30) setTimeout(tick, 100);
    };
    tick();
  };
  if (state.view !== 'home') { state.view = 'home'; refreshList(); }
  scroll();
}
function vediLezione(cardId) {
  var viewer = (window.CREATOR_DATA && window.CREATOR_DATA.viewerUrl) || ('http://' + (location.hostname || '127.0.0.1') + ':18000/');
  window.open(viewer.replace(/\/$/, '') + '/?open=' + encodeURIComponent(cardId), '_blank');
}
function fasciaLezioni() {
  var html = '<div class="card" style="margin-bottom:18px"><div class="step-head"><span class="eyebrow">🎓 Fascia lezioni — schede e lezioni</span></div>' +
    '<p class="step-note">Tutte le schede create: marchio <strong>draft</strong> se ancora da finire/approvare, <strong>release</strong> quando approvate e pronte da studiare.</p>';
  if (!state.materie.length) html += '<p class="step-note">Nessuna materia.</p>';
  else {
    html += '<div class="fascia-row">';
    state.materie.forEach(function (m) {
    var mh = '<div class="fascia-mat">';
    var all = (state.cards || []).filter(function (c) {
      return String(c.modelloId || '').split(':')[0] === m.id;
    });
    var drafts = all.filter(function (c) { return c.stato !== 'ready'; });
    var ready = all.filter(function (c) { return c.stato === 'ready'; });
    mh += '<h3>📚 ' + esc(m.nome || m.id) + '</h3>';
    if (!all.length) {
      mh += '<p class="step-note">Ancora nessuna lezione.</p>';
    } else {
      var modOf = function (c) {
        var found = null;
        var allLists = Object.keys(state.modelliTutti || {}).length ? state.modelliTutti : (state.modelliPerMateria || {});
        Object.keys(allLists).forEach(function (mid) {
          (allLists[mid] || []).forEach(function (x) { if (modelSid(x) === c.modelloId) found = x; });
        });
        return found;
      };
      drafts.forEach(function (c) {
        var mod = modOf(c);
        mh += '<div class="fascia-item"><div class="fascia-item-head"><strong>' + esc(c.titolo || 'Senza titolo') + '</strong>' +
          '<span class="badge">draft</span> <span class="step-note">' + esc((mod && mod.nome) || c.modelloId) + '</span></div>' +
          '<div class="fascia-item-actions"><button class="btn small" data-open-card="' + esc(c.id) + '">📝 Riempi / Genera</button>' +
          '<button class="btn small ghost" data-del-card="' + esc(c.id) + '">🗑</button></div></div>';
      });
      ready.forEach(function (c) {

function mwSave(w) {
  var errs = mwValidate(w);
  if (errs.length) { w.step = 4; render(); toast('Sistema prima gli errori (' + errs.length + ')'); return; }
  w.busy = true;
  render();
  var done = function (msg) {
    w.busy = false;
    toast(msg, true);
    state.view = 'home';
    refreshList();
  };
  var fail = function (e) { w.busy = false; render(); toast((e && e.message) || e); };
  (function () {
    var mid = w.materia.id.trim() || mwSlug(w.materia.nome);
    var savedMid = mid;
    var secBody = function (d) {
      var o = { key: d.key.trim(), title: d.title.trim(), type: d.type, required: !!d.required };
      if ((d.prompt || '').trim()) o.prompt = d.prompt;
      if ((d.system || '').trim()) o.system = d.system;
      if (d.maxWords !== '' && d.maxWords !== undefined && d.maxWords !== null) o.maxWords = Number(d.maxWords);
      return o;
    };
    post('/api/materie', { id: mid, nome: w.materia.nome.trim(), descrizione: w.materia.descrizione, systemPrompt: w.materia.systemPrompt })
      .then(function (r) {
        savedMid = (r.materia && r.materia.id) || mid;
        var chain = Promise.resolve();
        w.modelli.forEach(function (m) {
          chain = chain.then(function () {
            var body = { materiaId: savedMid, chiave: m.key.trim(), nome: m.nome.trim(), defaults: m.stile || { verbosita: 'standard', istruzione: 'secondaria', arricchisci: false, verifica: false } };
            var secs = m.sections.map(secBody);
            var pureClone = m.fromTemplate && m._tplSections && JSON.stringify(secs) === JSON.stringify(m._tplSections.map(secBody));
            if (pureClone) body.fromTemplate = m.fromTemplate;
            else body.sections = secs;
            return post('/api/models', body).then(function (r2) {
              var vp = (m.systemPrompt || '').trim();
              if (!vp) return r2;
              return patch('/api/models/' + encodeURIComponent(r2.model.id), { systemPrompt: vp }).then(function () { return r2; });
            });
          });
        });
        return chain;
      })
      .then(function () { done('Materia creata: rivedila in home, le schede partono da “Nuova scheda per materia”'); })
      .catch(fail);
  })();
}

        sections: sc.sections.map(function (d) { return { key: d.key, title: d.title, type: d.type, prompt: d.prompt || '', system: d.system || '' }; })
      };
    })
  }).then(function (r) {
    var arr = (r && r.models) || [];
    var retries = [];
    need.forEach(function (sc, i) {
      var o = arr[i] || null;
      if (o && o.ok) talkApplyAdapt(t, sc, o, r.materiaTone);
      else retries.push(sc);
    });
    var chain = Promise.resolve();
    retries.forEach(function (sc) { chain = chain.then(function () { return talkAdaptOne(t, sc); }); });
    return chain;
  }).catch(function () {
    var chain = Promise.resolve();
    need.forEach(function (sc) { chain = chain.then(function () { return talkAdaptOne(t, sc); }); });
    return chain;
  }).then(settle);
}
function talkEffPrompt(sc, d) {
  if (sc.useAdapted && sc.adapted && sc.adapted.ok && sc.adapted.byKey[d.key]) {
    var p = sc.adapted.byKey[d.key].prompt;
    if (p) return p;
  }
  return d.prompt || '';
}
function talkUniqueChiave(base, taken) {
  var c = base || 'modello', n = 0, out = c;
  while (taken.indexOf(out) >= 0) { n += 1; out = c + '-' + n; }
  taken.push(out);
  return out;
}
function talkEffSections(sc) {
  // Sezioni effettive come verranno salvate (adattate se scelte, senza quelle tolte).
  if (sc.mode === 'scratch' || !sc.sections.length) {
    return [{ key: 'introduzione', title: 'Introduzione', type: 'text', required: true, prompt: '', system: '' }];
  }
  var usingAdapted = sc.useAdapted && sc.adapted && sc.adapted.ok;
  return sc.sections.filter(function (d) { return sc.drop.indexOf(d.key) < 0; }).map(function (d) {
    var o = { key: d.key, title: d.title, type: d.type, required: !!d.required, prompt: d.prompt || '', system: d.system || '' };
    if (usingAdapted && sc.adapted.byKey[d.key]) {
      if (sc.adapted.byKey[d.key].prompt) o.prompt = sc.adapted.byKey[d.key].prompt;
      o.system = sc.adapted.byKey[d.key].system || '';
    }
    return o;
  });
}
function talkSave(t) {
  if (t.entry === 'materia' && !t.materia.nome.trim()) { toast('Scrivi il nome della materia'); return; }
  if (!t.scelte.length) { toast('Scegli almeno un tipo di scheda'); return; }
  for (var i = 0; i < t.scelte.length; i++) {
    if (!t.scelte[i].nome.trim()) { toast('Dai un nome a ogni modello'); t.step = 3; render(); return; }
  }
  t.busy = true;
  render();
  var matNome = t.entry === 'modello' ? t.fixedMateria.nome : t.materia.nome.trim();
  var mid = t.entry === 'modello' ? t.fixedMateria.id : '';
  var chain = Promise.resolve();
  if (t.entry === 'materia') {
    mid = mwSlug(t.materia.nome);
    chain = post('/api/materie', { id: mid, nome: t.materia.nome.trim(), descrizione: t.materia.descrizione, systemPrompt: t.materia.systemPrompt }).then(function (r) {
      mid = (r.materia && r.materia.id) || mid;
    });
  }
  chain.then(function () { return api('/api/models?subject=' + encodeURIComponent(mid)); })
    .then(function (r) {
      var taken = (r.models || []).map(function (m) { return m.chiave; });
      var seq = Promise.resolve();
      var created = [];
      t.scelte.forEach(function (sc) {
        seq = seq.then(function () {
          var chiave = talkUniqueChiave(mwSlug(sc.nome), taken);
          var body = { materiaId: mid, chiave: chiave, nome: sc.nome.trim(), defaults: sc.stile };
          if (sc.mode === 'scratch' || !sc.sections.length) {
            body.sections = [{ key: 'introduzione', title: 'Introduzione', type: 'text', required: true }];
          } else {
            var kept = sc.sections.filter(function (d) { return sc.drop.indexOf(d.key) < 0; });
            var usingAdapted = sc.useAdapted && sc.adapted && sc.adapted.ok;
            var effKept = kept.map(function (d) {
              var o = stripSec(d);
              if (usingAdapted && sc.adapted.byKey[d.key]) {
                if (sc.adapted.byKey[d.key].prompt) o.prompt = sc.adapted.byKey[d.key].prompt;
                o.system = sc.adapted.byKey[d.key].system || '';
                if (!o.prompt) delete o.prompt;
                if (!o.system) delete o.system;
              }
              return o;
            });
            var pure = usingAdapted ? false : (kept.length === sc.sections.length);
            if (pure && sc.tplId) body.fromTemplate = sc.tplId;
            else body.sections = effKept;
          }
          return post('/api/models', body).then(function (r2) {
            created.push({ id: r2.model.id, nome: sc.nome.trim(), nSec: (r2.model.schema.sections || []).length });
            if (sc.useAdapted && (sc.voice || '').trim()) {
              return patch('/api/models/' + encodeURIComponent(r2.model.id), { systemPrompt: sc.voice.trim() }).then(function () { return r2; });
            }
            return r2;
          });
        });
      });
      return seq.then(function () { return created; });
    })
    .then(function (created) {
      t.busy = false;
      t.done = { materiaNome: matNome, materiaId: mid, models: created };
      state.view = 'talk';
      refreshTalkCache(mid);
      render();
    })
    .catch(function (e) { t.busy = false; render(); toast((e && e.message) || e); });
}
function refreshTalkCache(mid) {
  api('/api/models?subject=' + encodeURIComponent(mid)).then(function (r) {
    state.modelliPerMateria[mid] = r.models || [];
  }).catch(function () {});
  api('/api/materie').then(function (r) { state.materie = r.materie || []; }).catch(function () {});
}
function bindTalkEdit(t) {
  var e = t.edit;
  if (!e) return;
  var back = document.getElementById('talkBack');
  if (back) back.onclick = function () {
    var steps = talkEditSteps(t);
    var i = steps.indexOf(t.step);
    if (i <= 0) { state.view = 'home'; refreshList(); return; }
    t.step = steps[i - 1];
    render();
  };
  var next = document.getElementById('talkNext');
  if (next) next.onclick = function () {
    if (t.step === 'e1' && !e.want.length) { toast('Scegli almeno una cosa da cambiare 👆'); return; }
    var steps = talkEditSteps(t);
    t.step = steps[steps.indexOf(t.step) + 1] || 'e5';
    render();
  };
  var save = document.getElementById('talkSaveEdit');
  if (save) save.onclick = function () { talkSaveEdit(t); };
  appEl.querySelectorAll('[data-talk-want]').forEach(function (box) {
    box.onchange = function () {
      var k = box.getAttribute('data-talk-want');
      var i = e.want.indexOf(k);
      if (box.checked && i < 0) e.want.push(k);
      if (!box.checked && i >= 0) e.want.splice(i, 1);
    };
  });
  var nome = document.getElementById('talkEditNome');
  if (nome) nome.oninput = function () { e.newNome = nome.value; };
  var evb = document.getElementById('talkEditVerb');
  if (evb) evb.onchange = function () { e.stile.verbosita = evb.value; e.stileDirty = true; };
  var eis = document.getElementById('talkEditIstr');
  if (eis) eis.onchange = function () { e.stile.istruzione = eis.value; e.stileDirty = true; };
  var ear = document.getElementById('talkEditArr');
  if (ear) ear.onchange = function () { e.stile.arricchisci = ear.checked; e.stileDirty = true; };
  var eve = document.getElementById('talkEditVer');
  if (eve) eve.onchange = function () { e.stile.verifica = eve.checked; e.stileDirty = true; };
  appEl.querySelectorAll('[data-talk-edrop]').forEach(function (box) {
    box.onchange = function () {
      var k = box.getAttribute('data-talk-edrop');
      var i = e.drop.indexOf(k);
      if (!box.checked && i < 0) e.drop.push(k);
      if (box.checked && i >= 0) e.drop.splice(i, 1);
    };
  });
  var addBtn = document.getElementById('talkAddSec');
  if (addBtn) addBtn.onclick = function () {
    var ti = document.getElementById('talkAddTitle');
    var ty = document.getElementById('talkAddType');
    var title = ti ? ti.value.trim() : '';
    if (!title) { toast('Scrivi il titolo della nuova parte'); return; }
    var key = mwSlug(title) || ('parte-' + (e.added.length + 1));
    e.added.push({ key: key, title: title, type: ty ? ty.value : 'text', required: false, prompt: '', system: '' });
    render();
  };
  var markDirty = function () { e.textsDirty = true; };
  appEl.querySelectorAll('[data-talk-etext]').forEach(function (inp) {
    var parts = inp.getAttribute('data-talk-etext').split(':');
    var handler = function () {
      var d = e.sections[Number(parts[0])];
      if (!d) return;
      d[parts[1]] = inp.value;
      markDirty();
    };
    inp.oninput = handler;
    inp.onchange = handler;
  });
  appEl.querySelectorAll('[data-talk-atext]').forEach(function (inp) {
    var parts = inp.getAttribute('data-talk-atext').split(':');
    var handler = function () {
      var d = e.added[Number(parts[0])];
      if (!d) return;
      d[parts[1]] = inp.value;
      markDirty();
    };
    inp.oninput = handler;
    inp.onchange = handler;
  });
}
function bindTalk(t) {
  if (t.entry === 'edit') { bindTalkEdit(t); return; }
  var back = document.getElementById('talkBack');
  if (back) back.onclick = function () {
    var first = t.entry === 'modello' ? 2 : 1;
    if (t.step <= first) { state.view = 'home'; refreshList(); return; }
    t.step -= 1;
    render();
  };
  var next = document.getElementById('talkNext');
  if (next) next.onclick = function () {
    if (t.step === 1) {
      if (!t.materia.nome.trim()) { toast('Scrivi il nome della materia'); return; }
      t.step = 2;
      if (!t.step2seen) {
        // Prima volta: l'AI suggerisce gli archetipi adatti (fallback: tutti e 4).
        t.step2seen = true;
        t.picked = [];
        t.loadingSugg = true;
        render();
        post('/api/models/suggest-archetypes', { materia: { nome: t.materia.nome.trim(), descrizione: t.materia.descrizione } }).then(function (r) {
          var valid = (r.suggested || []).filter(function (k) { return TALK_ARCH.some(function (a) { return a.key === k; }); });
          t.picked = valid.length ? valid : TALK_ARCH.map(function (a) { return a.key; });
          t.suggNote = r.note || '';
        }).catch(function () {
          t.picked = TALK_ARCH.map(function (a) { return a.key; });
          t.suggNote = '';
        }).then(function () {
          t.loadingSugg = false;
          if (t.step === 2) render();
        });
        return;
      }
      render();
    } else if (t.step === 2) {
      if (!t.picked.length) { toast('Scegline almeno una 👆'); return; }
      talkGotoStep3(t);
    } else if (t.step === 3) {
      var ok = true;
      t.scelte.forEach(function (sc) { if (!sc.nome.trim()) ok = false; });
      if (!ok) { toast('Dai un nome a ogni modello'); return; }
      t.step = 4;
      render();
    } else if (t.step === 4) {
      t.step = 5;
      render();
    }
  };
  var save = document.getElementById('talkSave');
  if (save) save.onclick = function () { talkSave(t); };
  var pre = document.getElementById('talkPreflight');
  if (pre) pre.onclick = function () {
    t.preflight = { loading: true, warnings: [], done: false };
    render();
    post('/api/models/preflight', {
      materia: { nome: t.entry === 'modello' ? t.fixedMateria.nome : t.materia.nome.trim() },
      models: t.scelte.map(function (sc) {
        var a = talkArch(sc.arch);
        return { nome: sc.nome.trim() || (a && a.nomeSug) || '?', sections: talkEffSections(sc) };
      })
    }).then(function (r) {
      t.preflight = { loading: false, warnings: r.warnings || [], done: true };
      render();
    }).catch(function () {
      t.preflight = null;
      render();
      toast('Controllo non riuscito (tengo i testi così come sono)');
    });
  };
  var first = document.getElementById('talkFirst');
  if (first) first.onclick = function () {
    if (t.done && t.done.models.length) newCardStudio(t.done.models[0].id);
  };
  var nome = document.getElementById('talkNome');
  if (nome) {
    nome.oninput = function () { t.materia.nome = nome.value; };
    var desc = document.getElementById('talkDesc');
    if (desc) desc.oninput = function () { t.materia.descrizione = desc.value; };
  }
  var tech = document.getElementById('talkTech');
  if (tech) tech.onclick = function (e) {
    e.preventDefault();
    talk = null;
    materiaWizard = new MateriaWizardView();
    state.view = 'materia-wizard';
    render();
  };
  appEl.querySelectorAll('[data-talk-arch]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-talk-arch');
      var i = t.picked.indexOf(k);
      if (i >= 0) t.picked.splice(i, 1);
      else t.picked.push(k);
      b.classList.toggle('on', i < 0);
      var st = b.querySelector('strong');
      if (st) st.textContent = (i < 0 ? '✓ ' : '') + talkArch(k).title;
    };
  });
  appEl.querySelectorAll('[data-talk-nome]').forEach(function (inp) {
    inp.oninput = function () { t.scelte[Number(inp.getAttribute('data-talk-nome'))].nome = inp.value; };
  });
  appEl.querySelectorAll('[data-talk-stile]').forEach(function (inp) {
    var parts = inp.getAttribute('data-talk-stile').split(':');
    var handler = function () {
      var sc = t.scelte[Number(parts[0])];
      if (!sc) return;
      var f = parts[1];
      if (f === 'arricchisci' || f === 'verifica') { sc.stile[f] = inp.checked; sc.stileTouched = true; }
      else {
        sc.stile[f] = inp.value;
        // Scelta intelligente: a livello università propone ricerca+verifica (modificabile).
        if (f === 'istruzione' && inp.value === 'universita' && !sc.stileTouched) {
          sc.stile.arricchisci = true;
          sc.stile.verifica = true;
          render();
        }
      }
    };
    inp.oninput = handler;
    inp.onchange = handler;
  });
  appEl.querySelectorAll('[data-talk-tplmode]').forEach(function (b) {
    b.onclick = function () {
      var parts = b.getAttribute('data-talk-tplmode').split(':');
      var sc = t.scelte[Number(parts[0])];
      sc.mode = parts[1];
      if (sc.mode === 'altro' && sc.tplAltri.length) sc.tplId = sc.tplAltri[0].id;
      if (sc.mode === 'main' && sc.tplMain) sc.tplId = sc.tplMain.id;
      if (sc.mode === 'scratch') { sc.sections = []; sc.drop = []; render(); return; }
      t.loading = true;
      render();
      talkLoadSections(sc.tplId).then(function (secs) { sc.sections = secs; sc.drop = []; t.loading = false; render(); })
        .catch(function () { sc.sections = []; sc.mode = 'scratch'; t.loading = false; render(); });
    };
  });
  appEl.querySelectorAll('[data-talk-altro]').forEach(function (sel) {
    sel.onchange = function () {
      var sc = t.scelte[Number(sel.getAttribute('data-talk-altro'))];
      sc.tplId = sel.value;
      t.loading = true;
      render();
      talkLoadSections(sc.tplId).then(function (secs) { sc.sections = secs; sc.drop = []; t.loading = false; render(); })
        .catch(function (e) { t.loading = false; render(); toast(e.message); });
    };
  });
  appEl.querySelectorAll('[data-talk-use]').forEach(function (b) {
    b.onclick = function () {
      var parts = b.getAttribute('data-talk-use').split(':');
      var sc = t.scelte[Number(parts[0])];
      sc.useAdapted = parts[1] === 'adattati';
      render();
    };
  });
  var tone = document.getElementById('talkTone');
  if (tone) tone.oninput = function () { t.materia.systemPrompt = tone.value; };
  appEl.querySelectorAll('[data-talk-voice]').forEach(function (inp) {
    inp.oninput = function () { t.scelte[Number(inp.getAttribute('data-talk-voice'))].voice = inp.value; };
  });
  appEl.querySelectorAll('[data-talk-drop]').forEach(function (box) {
    box.onchange = function () {
      var parts = box.getAttribute('data-talk-drop').split(':');
      var sc = t.scelte[Number(parts[0])];
      var i = sc.drop.indexOf(parts[1]);
      if (box.checked && i >= 0) sc.drop.splice(i, 1);
      if (!box.checked && i < 0) sc.drop.push(parts[1]);
    };
  });
}
/* ---------- home actions ---------- */
function refreshList() {
  Promise.all([api('/api/cards').catch(function () { return { cards: [] }; }), api('/api/materie').catch(function () { return { materie: [] }; })]).then(function (results) {
    state.cards = results[0].cards || [];
    state.materie = results[1].materie || [];
    state.view = 'home';
    render();
    // Modelli per materia, in parallelo, senza bloccare la home.
    state.materie.forEach(function (m) {
      api('/api/models?subject=' + encodeURIComponent(m.id)).then(function (r) {
        state.modelliPerMateria[m.id] = r.models || [];
        state.modelliTutti[m.id] = r.models || [];
        if (state.view === 'home') render();
      }).catch(function () {});
    });
  }).catch(function (e) { toast(e.message); });
}
/* ================= boot ================= */
bindGlobal();
api('/api/status').then(function (s) {
  if (!s.configured) toast('Chiave OpenRouter non configurata: le generazioni non funzioneranno');
});
refreshList();
</script>
